version: "3.8"

services:
  paper:
    image: itzg/minecraft-server
    container_name: minecraft-paper
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.20.4"
      MEMORY: "4G"
      ENABLE_RCON: "false"
      ONLINE_MODE: "false"
    volumes:
      - ./data:/data
    restart: unless-stopped
