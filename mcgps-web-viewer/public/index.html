<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McGPS - Real-time Player Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #header {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            pointer-events: auto;
        }

        #header h1 {
            font-size: 24px;
            color: #00ff88;
            margin-bottom: 5px;
        }

        #status {
            font-size: 14px;
            color: #88ffaa;
        }

        #player-list {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            min-width: 250px;
            max-height: 400px;
            overflow-y: auto;
            pointer-events: auto;
        }

        #player-list h2 {
            font-size: 18px;
            color: #00ff88;
            margin-bottom: 10px;
        }

        .player-item {
            padding: 8px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 14px;
        }

        .player-name {
            font-weight: bold;
            color: #00ffff;
        }

        .player-coords {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: 3px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            pointer-events: auto;
        }

        #controls h3 {
            font-size: 16px;
            color: #00ff88;
            margin-bottom: 10px;
        }

        #controls p {
            font-size: 13px;
            color: #cccccc;
            margin: 3px 0;
        }

        .connection-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .connected {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .disconnected {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* Scrollbar styling */
        #player-list::-webkit-scrollbar {
            width: 8px;
        }

        #player-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        #player-list::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 10px;
        }

        #fps-counter {
            position: absolute;
            top: 20px;
            left: 250px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: #00ff88;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        
        <div id="ui-overlay">
            <div id="header">
                <h1>McGPS Viewer</h1>
                <div id="status">
                    <span class="connection-status disconnected" id="status-indicator"></span>
                    <span id="status-text">Connecting...</span>
                </div>
            </div>

            <div id="player-list">
                <h2>Online Players (<span id="player-count">0</span>)</h2>
                <div id="players"></div>
            </div>

            <div id="controls">
                <h3>Controls</h3>
                <p><strong>Left Click + Drag:</strong> Look around</p>
                <p><strong>WASD:</strong> Move camera</p>
                <p><strong>Space/Shift:</strong> Move up/down</p>
                <p><strong>Hold Shift + WASD:</strong> Move faster</p>
                <p><strong>R:</strong> Reset camera</p>
            </div>

            <div id="fps-counter">
                FPS: <span id="fps-value">0</span>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        scene.fog = new THREE.Fog(0x87ceeb, 100, 500);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(50, 80, 50);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // First-person camera controls
        let yaw = 0;
        let pitch = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        const canvas = renderer.domElement;
        
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // Left click
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                canvas.style.cursor = 'grabbing';
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'default';
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            canvas.style.cursor = 'default';
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                
                // Update yaw (horizontal rotation) and pitch (vertical rotation)
                yaw -= deltaX * 0.002;
                pitch -= deltaY * 0.002;
                
                // Clamp pitch to avoid gimbal lock
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                
                // Update camera rotation
                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            }
        });

        // Keyboard state
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false,
            shift: false,
            space: false
        };

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(100, 200, 50);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -200;
        sunLight.shadow.camera.right = 200;
        sunLight.shadow.camera.top = 200;
        sunLight.shadow.camera.bottom = -200;
        sunLight.shadow.camera.far = 500;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // Ground grid
        const gridHelper = new THREE.GridHelper(500, 50, 0x00ff88, 0x444444);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // Y-axis reference (vertical line)
        const axisGeometry = new THREE.CylinderGeometry(0.2, 0.2, 256, 8);
        const axisMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const yAxis = new THREE.Mesh(axisGeometry, axisMaterial);
        yAxis.position.y = 128;
        scene.add(yAxis);

        // Block rendering setup
        const blockGroup = new THREE.Group();
        scene.add(blockGroup);

        // Block materials
        const blockMaterials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x5fad56 }), // Green
            dirt: new THREE.MeshLambertMaterial({ color: 0x8b5a3c }), // Brown
            stone: new THREE.MeshLambertMaterial({ color: 0x7f7f7f }), // Gray
            sand: new THREE.MeshLambertMaterial({ color: 0xdbc17f }), // Tan
            water: new THREE.MeshLambertMaterial({ color: 0x2389da, transparent: true, opacity: 0.7 }) // Blue transparent
        };

        // Block geometry (reused for all blocks)
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

        /**
         * Load and render blocks around a position
         */
        async function loadBlocks(x, z, radius = 32) {
            try {
                const response = await fetch(`/api/blocks?x=${Math.floor(x)}&z=${Math.floor(z)}&radius=${radius}`);
                const data = await response.json();
                
                // Clear existing blocks
                blockGroup.clear();
                
                // Render blocks
                data.blocks.forEach(block => {
                    const material = blockMaterials[block.type] || blockMaterials.stone;
                    const blockMesh = new THREE.Mesh(blockGeometry, material);
                    blockMesh.position.set(block.x, block.y, block.z);
                    blockMesh.castShadow = true;
                    blockMesh.receiveShadow = true;
                    blockGroup.add(blockMesh);
                });
                
                console.log(`Loaded ${data.blocks.length} blocks`);
            } catch (error) {
                console.error('Failed to load blocks:', error);
            }
        }

        // Load initial blocks at spawn (smaller radius for better performance)
        loadBlocks(0, 0, 30);

        /**
         * Update chunks from streamed data (real-time from plugin)
         */
        function updateChunks(chunkData) {
            // Clear existing blocks
            blockGroup.clear();
            
            // Render blocks from stream
            chunkData.blocks.forEach(block => {
                const material = blockMaterials[block.type] || blockMaterials.stone;
                const blockMesh = new THREE.Mesh(blockGeometry, material);
                blockMesh.position.set(block.x, block.y, block.z);
                blockMesh.castShadow = true;
                blockMesh.receiveShadow = true;
                blockGroup.add(blockMesh);
            });
            
            console.log(`Updated ${chunkData.blocks.length} blocks from real-time stream`);
        }

        // Player objects
        const players = new Map();

        // Player colors (cycle through them)
        const playerColors = [0x00ffff, 0xff00ff, 0xffff00, 0xff8800, 0x00ff00, 0xff0088];
        let colorIndex = 0;

        /**
         * Create or update a player in the scene
         */
        function updatePlayer(data) {
            const { uuid, name, x, y, z, yaw, pitch, world } = data;

            if (!players.has(uuid)) {
                // Create new player
                const color = playerColors[colorIndex % playerColors.length];
                colorIndex++;

                // Player body (smaller box)
                const bodyGeometry = new THREE.BoxGeometry(0.4, 0.9, 0.2);
                const bodyMaterial = new THREE.MeshStandardMaterial({ color: color });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.castShadow = true;

                // Player head with Minecraft skin
                const headGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                
                // Try to load Minecraft player skin from crafatar.com
                const skinLoader = new THREE.TextureLoader();
                const skinUrl = `https://crafatar.com/avatars/${uuid}?size=64&overlay`;
                const headMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0xffffff,
                    map: skinLoader.load(skinUrl, 
                        () => console.log(`Loaded skin for ${name}`),
                        undefined,
                        () => {
                            // Fallback to colored head if skin fails to load
                            headMaterial.color.set(color);
                        }
                    )
                });
                const head = new THREE.Mesh(headGeometry, headMaterial);
                head.position.y = 0.7;
                body.add(head);
                
                // Direction indicator (small arrow)
                const arrowGeometry = new THREE.ConeGeometry(0.15, 0.3, 8);
                const arrowMaterial = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 });
                const arrow = new THREE.Mesh(arrowGeometry, arrowMaterial);
                arrow.rotation.x = Math.PI / 2;
                arrow.position.z = 0.35;
                arrow.position.y = 0.7;
                body.add(arrow);

                // Name label (sprite)
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 256;
                canvas.height = 64;
                context.font = 'Bold 32px Arial';
                context.fillStyle = 'white';
                context.textAlign = 'center';
                context.fillText(name, 128, 40);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(spriteMaterial);
                sprite.scale.set(3, 0.75, 1);
                sprite.position.y = 1.5;
                body.add(sprite);

                // Trail line
                const trailGeometry = new THREE.BufferGeometry();
                const trailMaterial = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.5 });
                const trail = new THREE.Line(trailGeometry, trailMaterial);
                scene.add(trail);

                players.set(uuid, {
                    mesh: body,
                    trail: trail,
                    trailPoints: [],
                    color: color,
                    name: name
                });

                scene.add(body);
            }

            // Update player position
            const player = players.get(uuid);
            player.mesh.position.set(x, y, z);

            // Update rotation (yaw)
            player.mesh.rotation.y = THREE.MathUtils.degToRad(-yaw + 90);

            // Update trail
            player.trailPoints.push(new THREE.Vector3(x, y, z));
            if (player.trailPoints.length > 50) {
                player.trailPoints.shift();
            }
            player.trail.geometry.setFromPoints(player.trailPoints);

            // Update name if changed
            if (player.name !== name) {
                player.name = name;
                // Recreate name sprite (simplified)
            }
        }

        /**
         * Update player list UI
         */
        function updatePlayerList() {
            const playerListDiv = document.getElementById('players');
            const playerCountSpan = document.getElementById('player-count');

            playerListDiv.innerHTML = '';
            playerCountSpan.textContent = players.size;

            players.forEach((player, uuid) => {
                const pos = player.mesh.position;
                const item = document.createElement('div');
                item.className = 'player-item';
                item.innerHTML = `
                    <div class="player-name" style="color: #${player.color.toString(16).padStart(6, '0')}">${player.name}</div>
                    <div class="player-coords">X: ${pos.x.toFixed(1)} Y: ${pos.y.toFixed(1)} Z: ${pos.z.toFixed(1)}</div>
                `;
                playerListDiv.appendChild(item);
            });
        }

        /**
         * Connect to telemetry stream
         */
        function connectToStream() {
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');

            const eventSource = new EventSource('/telemetry-stream');

            eventSource.onopen = () => {
                statusIndicator.className = 'connection-status connected';
                statusText.textContent = 'Connected';
                console.log('Connected to telemetry stream');
            };

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'init') {
                    // Initial player data
                    Object.values(data.players).forEach(playerData => {
                        updatePlayer(playerData);
                    });
                    updatePlayerList();
                } else if (data.type === 'update') {
                    // Player update
                    updatePlayer(data.player);
                    updatePlayerList();
                } else if (data.type === 'chunks') {
                    // Chunk data streamed from plugin
                    console.log(`Received ${data.data.blocks.length} blocks from chunk stream`);
                    updateChunks(data.data);
                }
            };

            eventSource.onerror = () => {
                statusIndicator.className = 'connection-status disconnected';
                statusText.textContent = 'Reconnecting...';
                console.log('Connection lost, reconnecting...');
            };
        }

        /**
         * Animation loop
         */
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Calculate FPS
            frameCount++;
            const currentTime = performance.now();
            const deltaTime = (currentTime - lastTime) / 1000;

            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                document.getElementById('fps-value').textContent = fps;
            }

            // Handle WASD camera movement
            const moveSpeed = keys.shift ? 2.0 : 1.0;
            
            // Get camera's forward and right vectors
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, camera.up).normalize();

            if (keys.w) {
                camera.position.addScaledVector(forward, moveSpeed);
            }
            if (keys.s) {
                camera.position.addScaledVector(forward, -moveSpeed);
            }
            if (keys.a) {
                camera.position.addScaledVector(right, -moveSpeed);
            }
            if (keys.d) {
                camera.position.addScaledVector(right, moveSpeed);
            }
            if (keys.space) {
                camera.position.y += moveSpeed;
            }
            if (keys.shift && !keys.w && !keys.s && !keys.a && !keys.d) {
                camera.position.y -= moveSpeed;
            }

            renderer.render(scene, camera);
        }

        /**
         * Handle window resize
         */
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /**
         * Keyboard controls
         */
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true;
            if (key === 'a') keys.a = true;
            if (key === 's') keys.s = true;
            if (key === 'd') keys.d = true;
            if (key === 'shift') keys.shift = true;
            if (key === ' ') keys.space = true;
            
            if (key === 'r') {
                // Reset camera
                camera.position.set(50, 80, 50);
                yaw = 0;
                pitch = 0;
                camera.rotation.set(0, 0, 0);
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 'a') keys.a = false;
            if (key === 's') keys.s = false;
            if (key === 'd') keys.d = false;
            if (key === 'shift') keys.shift = false;
            if (key === ' ') keys.space = false;
        });

        // Start
        connectToStream();
        animate();
    </script>
</body>
</html>
