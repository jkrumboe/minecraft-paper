<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McGPS Viewer - Clean</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 2px solid #00ff88; pointer-events: auto; }
        #ui h1 { font-size: 20px; color: #00ff88; margin-bottom: 10px; }
        #status { font-size: 14px; color: #88ffaa; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
        .connected { background: #0f0; box-shadow: 0 0 10px #0f0; }
        .disconnected { background: #f00; box-shadow: 0 0 10px #f00; }
        #info { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; font-size: 12px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>McGPS Viewer</h1>
        <div id="status"><span class="dot disconnected" id="dot"></span><span id="status-text">Connecting...</span></div>
    </div>
    <div id="info">
        <div>FPS: <span id="fps">0</span></div>
        <div>Blocks: <span id="block-count">0</span></div>
        <div>Players: <span id="player-count">0</span></div>
        <div>Camera: <span id="camera-pos">0, 0, 0</span></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 100, 300);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 100, 100);
        
        // Calculate initial yaw and pitch from lookAt direction
        const initialTarget = new THREE.Vector3(0, 70, 0);
        const dx = initialTarget.x - camera.position.x;
        const dy = initialTarget.y - camera.position.y;
        const dz = initialTarget.z - camera.position.z;
        let yaw = Math.atan2(dx, dz);
        const distance = Math.sqrt(dx * dx + dz * dz);
        let pitch = -Math.atan2(dy, distance);
        
        // Apply initial rotation
        camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(100, 200, 100);
        scene.add(sun);

        // Camera controls
        let isDragging = false, lastX = 0, lastY = 0;
        const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };

        renderer.domElement.addEventListener('mousedown', e => {
            if (e.button === 0) { 
                isDragging = true; 
                lastX = e.clientX; 
                lastY = e.clientY;
                renderer.domElement.style.cursor = 'grabbing';
            }
        });
        
        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
            renderer.domElement.style.cursor = 'default';
        });
        
        renderer.domElement.addEventListener('mouseleave', () => {
            isDragging = false;
            renderer.domElement.style.cursor = 'default';
        });
        
        renderer.domElement.addEventListener('mousemove', e => {
            if (isDragging) {
                const deltaX = e.clientX - lastX;
                const deltaY = e.clientY - lastY;
                
                lastX = e.clientX;
                lastY = e.clientY;
                
                yaw -= deltaX * 0.003;
                pitch -= deltaY * 0.003;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            }
        });

        window.addEventListener('keydown', e => { 
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            if (key === ' ') keys.space = true;
        });
        
        window.addEventListener('keyup', e => { 
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
            if (key === ' ') keys.space = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function updateCamera() {
            // Calculate forward direction from yaw (ignoring pitch for movement)
            const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
            const moveSpeed = 0.5;
            const verticalSpeed = 0.3;

            // Move camera based on keys
            if (keys.w) camera.position.addScaledVector(forward, moveSpeed);
            if (keys.s) camera.position.addScaledVector(forward, -moveSpeed);
            if (keys.d) camera.position.addScaledVector(right, moveSpeed);
            if (keys.a) camera.position.addScaledVector(right, -moveSpeed);
            if (keys.space) camera.position.y += verticalSpeed;
            if (keys.shift) camera.position.y -= verticalSpeed;

            // Update camera rotation using quaternion to avoid gimbal lock
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            
            document.getElementById('camera-pos').textContent = 
                `${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)}`;
        }

        // Simple color materials for testing
        const materials = {
            grass: [
                new THREE.MeshLambertMaterial({ color: 0x7cbd6b }), // grass side
                new THREE.MeshLambertMaterial({ color: 0x7cbd6b }),
                new THREE.MeshLambertMaterial({ color: 0x5ca03b }), // grass top (darker green)
                new THREE.MeshLambertMaterial({ color: 0x8b6f47 }), // dirt bottom
                new THREE.MeshLambertMaterial({ color: 0x7cbd6b }),
                new THREE.MeshLambertMaterial({ color: 0x7cbd6b })
            ],
            dirt: new THREE.MeshLambertMaterial({ color: 0x8b6f47 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x7f7f7f }),
            cobblestone: new THREE.MeshLambertMaterial({ color: 0x636363 }),
            sand: new THREE.MeshLambertMaterial({ color: 0xdbd3a0 }),
            gravel: new THREE.MeshLambertMaterial({ color: 0x7a7a7a }),
            water: new THREE.MeshLambertMaterial({ color: 0x3f76e4, transparent: true, opacity: 0.7 }),
            wood: [
                new THREE.MeshLambertMaterial({ color: 0x6f5436 }), // log side
                new THREE.MeshLambertMaterial({ color: 0x6f5436 }),
                new THREE.MeshLambertMaterial({ color: 0x9b7653 }), // log top
                new THREE.MeshLambertMaterial({ color: 0x9b7653 }),
                new THREE.MeshLambertMaterial({ color: 0x6f5436 }),
                new THREE.MeshLambertMaterial({ color: 0x6f5436 })
            ],
            leaves: new THREE.MeshLambertMaterial({ color: 0x3a8d2a }),
            planks: new THREE.MeshLambertMaterial({ color: 0x9d804f }),
            snow: new THREE.MeshLambertMaterial({ color: 0xfffafa })
        };

        console.log('✓ Using simple color materials');

        // Block rendering
        const blockGroup = new THREE.Group();
        scene.add(blockGroup);
        const players = new Map();
        let pendingBlocks = null;

        // Render blocks directly (no texture loading needed)
        function renderBlocks(blocks) {
            blockGroup.clear();
            
            // Debug: log unique block types
            const uniqueTypes = new Set(blocks.map(b => b.type));
            const typeCounts = {};
            blocks.forEach(b => {
                typeCounts[b.type] = (typeCounts[b.type] || 0) + 1;
            });
            console.log('Block types received:', Array.from(uniqueTypes));
            console.log('Block counts by type:', typeCounts);
            
            const blockMap = new Map();
            blocks.forEach(b => blockMap.set(`${b.x},${b.y},${b.z}`, b.type));
            
            const hasBlock = (x, y, z) => blockMap.has(`${x},${y},${z}`);
            
            const geometryByType = {};
            
            blocks.forEach(({ x, y, z, type = 'stone' }) => {
                const faces = {
                    px: !hasBlock(x + 1, y, z),
                    nx: !hasBlock(x - 1, y, z),
                    py: !hasBlock(x, y + 1, z),
                    ny: !hasBlock(x, y - 1, z),
                    pz: !hasBlock(x, y, z + 1),
                    nz: !hasBlock(x, y, z - 1)
                };
                
                if (!Object.values(faces).some(v => v)) return;
                
                if (!geometryByType[type]) geometryByType[type] = [];
                geometryByType[type].push({ x, y, z, faces });
            });
            
            Object.keys(geometryByType).forEach(type => {
                const data = geometryByType[type];
                const mat = materials[type] || materials.stone;
                const isMultiMaterial = Array.isArray(mat);
                
                // Debug: log if material not found
                if (!materials[type]) {
                    console.warn(`No material for type '${type}', using stone`);
                }
                
                if (isMultiMaterial) {
                    // Multi-material (grass, wood) - need material groups
                    data.forEach(d => {
                        const geo = createCulledBox(d.faces, true);
                        const mesh = new THREE.Mesh(geo, mat);
                        mesh.position.set(d.x, d.y, d.z);
                        blockGroup.add(mesh);
                    });
                } else {
                    // Single material - merge for performance
                    const merged = new THREE.BufferGeometry();
                    const positions = [], normals = [], uvs = [], indices = [];
                    let offset = 0;
                    
                    data.forEach(d => {
                        const geo = createCulledBox(d.faces, false);
                        geo.translate(d.x, d.y, d.z);
                        
                        const pos = geo.getAttribute('position');
                        const norm = geo.getAttribute('normal');
                        const uv = geo.getAttribute('uv');
                        const idx = geo.getIndex();
                        
                        for (let i = 0; i < pos.count; i++) {
                            positions.push(pos.getX(i), pos.getY(i), pos.getZ(i));
                            normals.push(norm.getX(i), norm.getY(i), norm.getZ(i));
                            uvs.push(uv.getX(i), uv.getY(i));
                        }
                        
                        for (let i = 0; i < idx.count; i++) {
                            indices.push(idx.getX(i) + offset);
                        }
                        
                        offset += pos.count;
                        geo.dispose();
                    });
                    
                    merged.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    merged.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
                    merged.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                    merged.setIndex(indices);
                    
                    blockGroup.add(new THREE.Mesh(merged, mat));
                }
            });
            
            document.getElementById('block-count').textContent = blocks.length;
            console.log(`Rendered ${blocks.length} blocks`);
        }

        // Multi-material order: [+x, -x, +y, -y, +z, -z] = [right, left, top, bottom, front, back]
        function createCulledBox(faces, useMultiMaterial = false) {
            const geo = new THREE.BufferGeometry();
            const positions = [], normals = [], uvs = [], indices = [];
            let v = 0;
            let groupStart = 0;
            
            // Face definitions with material index for multi-material
            // Material indices: 0=+x, 1=-x, 2=+y, 3=-y, 4=+z, 5=-z
            const faceData = [
                { key: 'px', verts: [0.5,-0.5,-0.5, 0.5,0.5,-0.5, 0.5,0.5,0.5, 0.5,-0.5,0.5], norm: [1,0,0], uv: [0,1, 0,0, 1,0, 1,1], matIdx: 0 },
                { key: 'nx', verts: [-0.5,-0.5,0.5, -0.5,0.5,0.5, -0.5,0.5,-0.5, -0.5,-0.5,-0.5], norm: [-1,0,0], uv: [0,1, 0,0, 1,0, 1,1], matIdx: 1 },
                { key: 'py', verts: [-0.5,0.5,-0.5, -0.5,0.5,0.5, 0.5,0.5,0.5, 0.5,0.5,-0.5], norm: [0,1,0], uv: [0,1, 0,0, 1,0, 1,1], matIdx: 2 },
                { key: 'ny', verts: [-0.5,-0.5,-0.5, 0.5,-0.5,-0.5, 0.5,-0.5,0.5, -0.5,-0.5,0.5], norm: [0,-1,0], uv: [0,1, 1,1, 1,0, 0,0], matIdx: 3 },
                { key: 'pz', verts: [-0.5,-0.5,0.5, 0.5,-0.5,0.5, 0.5,0.5,0.5, -0.5,0.5,0.5], norm: [0,0,1], uv: [0,1, 1,1, 1,0, 0,0], matIdx: 4 },
                { key: 'nz', verts: [0.5,-0.5,-0.5, -0.5,-0.5,-0.5, -0.5,0.5,-0.5, 0.5,0.5,-0.5], norm: [0,0,-1], uv: [0,1, 1,1, 1,0, 0,0], matIdx: 5 }
            ];
            
            faceData.forEach(face => {
                if (!faces[face.key]) return;
                
                positions.push(...face.verts);
                normals.push(...Array(4).fill(face.norm).flat());
                uvs.push(...face.uv);
                indices.push(v, v + 1, v + 2, v, v + 2, v + 3);
                
                if (useMultiMaterial) {
                    // Add a group for this face (6 indices per face = 2 triangles)
                    geo.addGroup(groupStart, 6, face.matIdx);
                    groupStart += 6;
                }
                
                v += 4;
            });
            
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geo.setIndex(indices);
            
            return geo;
        }

        function updatePlayer(data) {
            const { uuid, name, x, y, z } = data;
            
            if (!players.has(uuid)) {
                // Create player
                const group = new THREE.Group();
                
                // Body
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 1.5, 0.3),
                    new THREE.MeshLambertMaterial({ color: 0x00ffff })
                );
                body.position.y = 0.75;
                
                // Head
                const head = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.5, 0.5),
                    new THREE.MeshLambertMaterial({ color: 0x00ffff })
                );
                head.position.y = 1.75;
                
                // Name tag
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 256, 64);
                ctx.fillStyle = '#fff';
                ctx.font = '32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(name || uuid.substring(0, 8), 128, 42);
                
                const nameTexture = new THREE.CanvasTexture(canvas);
                const nameTag = new THREE.Mesh(
                    new THREE.PlaneGeometry(2, 0.5),
                    new THREE.MeshBasicMaterial({ map: nameTexture, transparent: true })
                );
                nameTag.position.y = 2.5;
                
                group.add(body);
                group.add(head);
                group.add(nameTag);
                scene.add(group);
                
                players.set(uuid, { group, nameTag });
            }
            
            const player = players.get(uuid);
            player.group.position.set(x, y, z);
            player.nameTag.lookAt(camera.position);
            
            document.getElementById('player-count').textContent = players.size;
        }

        // Connect to server
        const eventSource = new EventSource('/telemetry-stream');
        
        eventSource.onopen = () => {
            console.log('Connected');
            document.getElementById('dot').className = 'dot connected';
            document.getElementById('status-text').textContent = 'Connected';
        };
        
        eventSource.onerror = () => {
            console.error('Disconnected');
            document.getElementById('dot').className = 'dot disconnected';
            document.getElementById('status-text').textContent = 'Disconnected';
        };
        
        eventSource.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            
            if (msg.type === 'init') {
                Object.values(msg.players).forEach(updatePlayer);
            } else if (msg.type === 'update') {
                updatePlayer(msg.player);
            } else if (msg.type === 'chunks') {
                console.log(`Received ${msg.data.blocks.length} blocks`);
                renderBlocks(msg.data.blocks);
                
                // Position camera to view the blocks
                if (msg.data.blocks.length > 0) {
                    // Calculate center of all blocks
                    let minX = Infinity, maxX = -Infinity;
                    let minY = Infinity, maxY = -Infinity;
                    let minZ = Infinity, maxZ = -Infinity;
                    
                    msg.data.blocks.forEach(b => {
                        minX = Math.min(minX, b.x);
                        maxX = Math.max(maxX, b.x);
                        minY = Math.min(minY, b.y);
                        maxY = Math.max(maxY, b.y);
                        minZ = Math.min(minZ, b.z);
                        maxZ = Math.max(maxZ, b.z);
                    });
                    
                    const centerX = (minX + maxX) / 2;
                    const centerY = (minY + maxY) / 2;
                    const centerZ = (minZ + maxZ) / 2;
                    
                    // Position camera above and back from center
                    camera.position.set(centerX, centerY + 50, centerZ + 80);
                    
                    // Update yaw and pitch to match camera look direction
                    const dx = centerX - camera.position.x;
                    const dy = centerY - camera.position.y;
                    const dz = centerZ - camera.position.z;
                    yaw = Math.atan2(dx, dz);
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    pitch = -Math.atan2(dy, distance);
                    
                    // Apply the rotation immediately
                    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                    
                    console.log(`Camera positioned at (${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)}) looking at (${Math.floor(centerX)}, ${Math.floor(centerY)}, ${Math.floor(centerZ)})`);
                }
            }
        };

        // FPS counter
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Update FPS
            frameCount++;
            const currentTime = performance.now();
            if (currentTime >= lastTime + 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastTime = currentTime;
            }
            
            updateCamera();
            renderer.render(scene, camera);
        }
        
        animate();
        console.log('McGPS Viewer initialized');
    </script>
</body>
</html>
