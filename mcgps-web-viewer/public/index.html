<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McGPS Viewer - Clean</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 2px solid #00ff88; pointer-events: auto; }
        #ui h1 { font-size: 20px; color: #00ff88; margin-bottom: 10px; }
        #status { font-size: 14px; color: #88ffaa; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
        .connected { background: #0f0; box-shadow: 0 0 10px #0f0; }
        .disconnected { background: #f00; box-shadow: 0 0 10px #f00; }
        #info { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; font-size: 12px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>McGPS Viewer</h1>
        <div id="status"><span class="dot disconnected" id="dot"></span><span id="status-text">Connecting...</span></div>
    </div>
    <div id="info">
        <div>FPS: <span id="fps">0</span></div>
        <div>Blocks: <span id="block-count">0</span></div>
        <div>Players: <span id="player-count">0</span></div>
        <div>Camera: <span id="camera-pos">0, 0, 0</span></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 100, 300);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 100, 100);
        
        // Calculate initial yaw and pitch from lookAt direction
        const initialTarget = new THREE.Vector3(0, 70, 0);
        const dx = initialTarget.x - camera.position.x;
        const dy = initialTarget.y - camera.position.y;
        const dz = initialTarget.z - camera.position.z;
        let yaw = Math.atan2(dx, dz);
        const distance = Math.sqrt(dx * dx + dz * dz);
        let pitch = -Math.atan2(dy, distance);
        
        // Apply initial rotation
        camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

        const renderer = new THREE.WebGLRenderer({ 
            antialias: false,  // Disable for performance
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(100, 200, 100);
        scene.add(sun);

        // Camera controls
        let isDragging = false, lastX = 0, lastY = 0;
        const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };

        renderer.domElement.addEventListener('mousedown', e => {
            if (e.button === 0) { 
                isDragging = true; 
                lastX = e.clientX; 
                lastY = e.clientY;
                renderer.domElement.style.cursor = 'grabbing';
            }
        });
        
        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
            renderer.domElement.style.cursor = 'default';
        });
        
        renderer.domElement.addEventListener('mouseleave', () => {
            isDragging = false;
            renderer.domElement.style.cursor = 'default';
        });
        
        renderer.domElement.addEventListener('mousemove', e => {
            if (isDragging) {
                const deltaX = e.clientX - lastX;
                const deltaY = e.clientY - lastY;
                
                lastX = e.clientX;
                lastY = e.clientY;
                
                yaw -= deltaX * 0.003;
                pitch -= deltaY * 0.003;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            }
        });

        window.addEventListener('keydown', e => { 
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            if (key === ' ') keys.space = true;
        });
        
        window.addEventListener('keyup', e => { 
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
            if (key === ' ') keys.space = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function updateCamera() {
            // Calculate forward direction from yaw (ignoring pitch for movement)
            const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
            const moveSpeed = 0.5;
            const verticalSpeed = 0.3;

            // Move camera based on keys
            if (keys.w) camera.position.addScaledVector(forward, moveSpeed);
            if (keys.s) camera.position.addScaledVector(forward, -moveSpeed);
            if (keys.d) camera.position.addScaledVector(right, moveSpeed);
            if (keys.a) camera.position.addScaledVector(right, -moveSpeed);
            if (keys.space) camera.position.y += verticalSpeed;
            if (keys.shift) camera.position.y -= verticalSpeed;

            // Update camera rotation using quaternion to avoid gimbal lock
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            
            document.getElementById('camera-pos').textContent = 
                `${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)}`;
        }

        // Simple color materials - ALL single materials for performance
        // (Multi-material creates separate draw calls per block - very slow)
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x5ca03b }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x8b6f47 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x7f7f7f }),
            cobblestone: new THREE.MeshLambertMaterial({ color: 0x636363 }),
            sand: new THREE.MeshLambertMaterial({ color: 0xdbd3a0 }),
            gravel: new THREE.MeshLambertMaterial({ color: 0x7a7a7a }),
            water: new THREE.MeshLambertMaterial({ color: 0x3f76e4, transparent: true, opacity: 0.7 }),
            wood: new THREE.MeshLambertMaterial({ color: 0x6f5436 }),
            leaves: new THREE.MeshLambertMaterial({ color: 0x3a8d2a }),
            planks: new THREE.MeshLambertMaterial({ color: 0x9d804f }),
            snow: new THREE.MeshLambertMaterial({ color: 0xfffafa })
        };

        console.log('✓ Using optimized single-color materials');

        // Chunk-based rendering system (like Minecraft)
        const CHUNK_SIZE = 16;
        const chunkMeshes = new Map(); // Map<chunkKey, THREE.Group>
        const chunkGroup = new THREE.Group();
        scene.add(chunkGroup);
        
        const players = new Map();
        let pendingBlocks = null;
        
        // Global block map for incremental updates
        let globalBlockMap = new Map();
        let globalBlocks = [];
        let needsRebuild = false;
        
        // Pre-computed face vertex data for speed
        const FACE_DATA = {
            px: { verts: [0.5,-0.5,-0.5, 0.5,0.5,-0.5, 0.5,0.5,0.5, 0.5,-0.5,0.5], norm: [1,0,0] },
            nx: { verts: [-0.5,-0.5,0.5, -0.5,0.5,0.5, -0.5,0.5,-0.5, -0.5,-0.5,-0.5], norm: [-1,0,0] },
            py: { verts: [-0.5,0.5,-0.5, -0.5,0.5,0.5, 0.5,0.5,0.5, 0.5,0.5,-0.5], norm: [0,1,0] },
            ny: { verts: [-0.5,-0.5,-0.5, 0.5,-0.5,-0.5, 0.5,-0.5,0.5, -0.5,-0.5,0.5], norm: [0,-1,0] },
            pz: { verts: [-0.5,-0.5,0.5, 0.5,-0.5,0.5, 0.5,0.5,0.5, -0.5,0.5,0.5], norm: [0,0,1] },
            nz: { verts: [0.5,-0.5,-0.5, -0.5,-0.5,-0.5, -0.5,0.5,-0.5, 0.5,0.5,-0.5], norm: [0,0,-1] }
        };
        
        // Frustum for culling
        const frustum = new THREE.Frustum();
        const projScreenMatrix = new THREE.Matrix4();

        // Get chunk key from world coordinates
        function getChunkKey(x, y, z) {
            const cx = Math.floor(x / CHUNK_SIZE);
            const cy = Math.floor(y / CHUNK_SIZE);
            const cz = Math.floor(z / CHUNK_SIZE);
            return `${cx},${cy},${cz}`;
        }

        // Build optimized geometry for a chunk
        function buildChunkMesh(blocks, blockMap) {
            // Group blocks by type for batching
            const byType = {};
            
            blocks.forEach(({ x, y, z, type = 'stone' }) => {
                // Determine visible faces (occlusion culling)
                const faces = [];
                if (!blockMap.has(`${x+1},${y},${z}`)) faces.push('px');
                if (!blockMap.has(`${x-1},${y},${z}`)) faces.push('nx');
                if (!blockMap.has(`${x},${y+1},${z}`)) faces.push('py');
                if (!blockMap.has(`${x},${y-1},${z}`)) faces.push('ny');
                if (!blockMap.has(`${x},${y},${z+1}`)) faces.push('pz');
                if (!blockMap.has(`${x},${y},${z-1}`)) faces.push('nz');
                
                if (faces.length === 0) return; // Fully occluded
                
                if (!byType[type]) byType[type] = [];
                byType[type].push({ x, y, z, faces });
            });
            
            const group = new THREE.Group();
            
            // Build merged geometry per material type
            Object.keys(byType).forEach(type => {
                const data = byType[type];
                const mat = materials[type] || materials.stone;
                
                // Merge all blocks of this type into one geometry
                const positions = [];
                const normals = [];
                const indices = [];
                let vertexOffset = 0;
                
                data.forEach(({ x, y, z, faces }) => {
                    faces.forEach(faceKey => {
                        const face = FACE_DATA[faceKey];
                        // Add translated vertices
                        for (let i = 0; i < 12; i += 3) {
                            positions.push(
                                face.verts[i] + x,
                                face.verts[i + 1] + y,
                                face.verts[i + 2] + z
                            );
                        }
                        // Add normals (4 vertices per face)
                        for (let i = 0; i < 4; i++) {
                            normals.push(face.norm[0], face.norm[1], face.norm[2]);
                        }
                        // Add indices (2 triangles per face)
                        indices.push(
                            vertexOffset, vertexOffset + 1, vertexOffset + 2,
                            vertexOffset, vertexOffset + 2, vertexOffset + 3
                        );
                        vertexOffset += 4;
                    });
                });
                
                if (positions.length === 0) return;
                
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
                geometry.setIndex(indices);
                geometry.computeBoundingSphere();
                
                const mesh = new THREE.Mesh(geometry, mat);
                mesh.matrixAutoUpdate = false; // Performance: skip matrix calc
                mesh.updateMatrix();
                group.add(mesh);
            });
            
            // Compute bounding sphere for frustum culling
            const box = new THREE.Box3();
            group.children.forEach(mesh => {
                if (mesh.geometry.boundingBox === null) {
                    mesh.geometry.computeBoundingBox();
                }
                box.union(mesh.geometry.boundingBox);
            });
            group.userData.boundingSphere = new THREE.Sphere();
            box.getBoundingSphere(group.userData.boundingSphere);
            
            return group;
        }

        // Render blocks using chunk system
        function renderBlocks(blocks) {
            console.time('renderBlocks');
            
            // Store globally for incremental updates
            globalBlocks = blocks.slice();
            globalBlockMap.clear();
            blocks.forEach(b => globalBlockMap.set(`${b.x},${b.y},${b.z}`, b.type));
            
            rebuildAllChunks();
            
            console.timeEnd('renderBlocks');
            console.log(`Rendered ${blocks.length} blocks in ${chunkMeshes.size} chunks`);
        }
        
        // Rebuild all chunk meshes from globalBlocks
        function rebuildAllChunks() {
            // Clear old chunks
            chunkMeshes.forEach(mesh => {
                chunkGroup.remove(mesh);
                mesh.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                });
            });
            chunkMeshes.clear();
            
            // Group blocks into chunks
            const chunkBlocks = new Map();
            globalBlocks.forEach(block => {
                const key = getChunkKey(block.x, block.y, block.z);
                if (!chunkBlocks.has(key)) chunkBlocks.set(key, []);
                chunkBlocks.get(key).push(block);
            });
            
            // Build mesh for each chunk
            chunkBlocks.forEach((chunkBlockList, key) => {
                const mesh = buildChunkMesh(chunkBlockList, globalBlockMap);
                const [cx, cy, cz] = key.split(',').map(Number);
                mesh.position.set(0, 0, 0);
                mesh.userData.chunkCenter = new THREE.Vector3(
                    (cx + 0.5) * CHUNK_SIZE,
                    (cy + 0.5) * CHUNK_SIZE,
                    (cz + 0.5) * CHUNK_SIZE
                );
                chunkMeshes.set(key, mesh);
                chunkGroup.add(mesh);
            });
            
            document.getElementById('block-count').textContent = `${globalBlocks.length} (${chunkMeshes.size} chunks)`;
        }
        
        // Rebuild only affected chunks (for incremental updates)
        function rebuildChunk(chunkKey) {
            // Remove old chunk mesh if exists
            if (chunkMeshes.has(chunkKey)) {
                const oldMesh = chunkMeshes.get(chunkKey);
                chunkGroup.remove(oldMesh);
                oldMesh.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                });
                chunkMeshes.delete(chunkKey);
            }
            
            // Get blocks in this chunk
            const [cx, cy, cz] = chunkKey.split(',').map(Number);
            const chunkBlockList = globalBlocks.filter(b => 
                Math.floor(b.x / CHUNK_SIZE) === cx &&
                Math.floor(b.y / CHUNK_SIZE) === cy &&
                Math.floor(b.z / CHUNK_SIZE) === cz
            );
            
            if (chunkBlockList.length === 0) return;
            
            // Rebuild mesh
            const mesh = buildChunkMesh(chunkBlockList, globalBlockMap);
            mesh.position.set(0, 0, 0);
            mesh.userData.chunkCenter = new THREE.Vector3(
                (cx + 0.5) * CHUNK_SIZE,
                (cy + 0.5) * CHUNK_SIZE,
                (cz + 0.5) * CHUNK_SIZE
            );
            chunkMeshes.set(chunkKey, mesh);
            chunkGroup.add(mesh);
        }
        
        // Handle real-time block changes
        function handleBlockChange(data) {
            const { type, x, y, z, blockType } = data;
            const key = `${x},${y},${z}`;
            const chunkKey = getChunkKey(x, y, z);
            
            // Get adjacent chunk keys that might need updating
            const adjacentChunks = new Set([chunkKey]);
            [
                [x+1, y, z], [x-1, y, z],
                [x, y+1, z], [x, y-1, z],
                [x, y, z+1], [x, y, z-1]
            ].forEach(([ax, ay, az]) => {
                adjacentChunks.add(getChunkKey(ax, ay, az));
            });
            
            if (type === 'block_break') {
                // Remove block from global data
                globalBlockMap.delete(key);
                globalBlocks = globalBlocks.filter(b => !(b.x === x && b.y === y && b.z === z));
                console.log(`Block broken at (${x}, ${y}, ${z})`);
            } else if (type === 'block_place') {
                // Add block to global data
                if (!globalBlockMap.has(key)) {
                    globalBlocks.push({ x, y, z, type: blockType });
                    globalBlockMap.set(key, blockType);
                    console.log(`Block placed at (${x}, ${y}, ${z}): ${blockType}`);
                }
            }
            
            // Rebuild affected chunks
            adjacentChunks.forEach(ck => rebuildChunk(ck));
            
            document.getElementById('block-count').textContent = `${globalBlocks.length} (${chunkMeshes.size} chunks)`;
        }

        // Frustum culling update (called each frame)
        function updateFrustumCulling() {
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(projScreenMatrix);
            
            let visibleChunks = 0;
            chunkMeshes.forEach((mesh) => {
                if (mesh.userData.boundingSphere) {
                    const sphere = mesh.userData.boundingSphere.clone();
                    sphere.center.add(mesh.position);
                    mesh.visible = frustum.intersectsSphere(sphere);
                } else {
                    mesh.visible = true;
                }
                if (mesh.visible) visibleChunks++;
            });
        }
        function updatePlayer(data) {
            const { uuid, name, x, y, z } = data;
            
            if (!players.has(uuid)) {
                // Create player - Minecraft player is ~1.8 blocks tall
                const group = new THREE.Group();
                
                // Body (centered at y=0.9, height 1.5)
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 1.5, 0.3),
                    new THREE.MeshLambertMaterial({ color: 0x00ffff })
                );
                body.position.y = 0.75; // Body center at 0.75 (0 to 1.5)
                
                // Head (on top of body)
                const head = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.5, 0.5),
                    new THREE.MeshLambertMaterial({ color: 0x00ffff })
                );
                head.position.y = 1.75; // Head center at 1.75
                
                // Name tag
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 256, 64);
                ctx.fillStyle = '#fff';
                ctx.font = '32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(name || uuid.substring(0, 8), 128, 42);
                
                const nameTexture = new THREE.CanvasTexture(canvas);
                const nameTag = new THREE.Mesh(
                    new THREE.PlaneGeometry(2, 0.5),
                    new THREE.MeshBasicMaterial({ map: nameTexture, transparent: true })
                );
                nameTag.position.y = 2.3;
                
                group.add(body);
                group.add(head);
                group.add(nameTag);
                scene.add(group);
                
                players.set(uuid, { group, nameTag });
            }
            
            const player = players.get(uuid);
            // Minecraft blocks at (x,y,z) span x→x+1, y→y+1, z→z+1
            // Our Three.js blocks are centered, so block (19,78,27) spans 18.5→19.5, etc.
            // Offset player by -0.5 on all axes to align with our block positions
            player.group.position.set(x - 0.5, y - 0.5, z - 0.5);
            player.nameTag.lookAt(camera.position);
            
            document.getElementById('player-count').textContent = players.size;
        }

        // Connect to server
        const eventSource = new EventSource('/telemetry-stream');
        
        eventSource.onopen = () => {
            console.log('Connected');
            document.getElementById('dot').className = 'dot connected';
            document.getElementById('status-text').textContent = 'Connected';
        };
        
        eventSource.onerror = () => {
            console.error('Disconnected');
            document.getElementById('dot').className = 'dot disconnected';
            document.getElementById('status-text').textContent = 'Disconnected';
        };
        
        eventSource.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            
            if (msg.type === 'init') {
                Object.values(msg.players).forEach(updatePlayer);
            } else if (msg.type === 'update') {
                updatePlayer(msg.player);
            } else if (msg.type === 'block_change') {
                // Real-time block update
                handleBlockChange(msg.data);
            } else if (msg.type === 'chunks') {
                console.log(`Received ${msg.data.blocks.length} blocks`);
                renderBlocks(msg.data.blocks);
                
                // Position camera to view the blocks
                if (msg.data.blocks.length > 0) {
                    // Calculate center of all blocks
                    let minX = Infinity, maxX = -Infinity;
                    let minY = Infinity, maxY = -Infinity;
                    let minZ = Infinity, maxZ = -Infinity;
                    
                    msg.data.blocks.forEach(b => {
                        minX = Math.min(minX, b.x);
                        maxX = Math.max(maxX, b.x);
                        minY = Math.min(minY, b.y);
                        maxY = Math.max(maxY, b.y);
                        minZ = Math.min(minZ, b.z);
                        maxZ = Math.max(maxZ, b.z);
                    });
                    
                    const centerX = (minX + maxX) / 2;
                    const centerY = (minY + maxY) / 2;
                    const centerZ = (minZ + maxZ) / 2;
                    
                    // Position camera above and back from center
                    camera.position.set(centerX, centerY + 50, centerZ + 80);
                    
                    // Update yaw and pitch to match camera look direction
                    const dx = centerX - camera.position.x;
                    const dy = centerY - camera.position.y;
                    const dz = centerZ - camera.position.z;
                    yaw = Math.atan2(dx, dz);
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    pitch = -Math.atan2(dy, distance);
                    
                    // Apply the rotation immediately
                    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                    
                    console.log(`Camera positioned at (${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)}) looking at (${Math.floor(centerX)}, ${Math.floor(centerY)}, ${Math.floor(centerZ)})`);
                }
            }
        };

        // FPS counter
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Update FPS
            frameCount++;
            const currentTime = performance.now();
            if (currentTime >= lastTime + 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastTime = currentTime;
            }
            
            updateCamera();
            updateFrustumCulling(); // Frustum cull chunks
            renderer.render(scene, camera);
        }
        
        animate();
        console.log('McGPS Viewer initialized');
    </script>
</body>
</html>
