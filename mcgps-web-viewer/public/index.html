<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McGPS Viewer - Clean</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 2px solid #00ff88; pointer-events: auto; }
        #ui h1 { font-size: 20px; color: #00ff88; margin-bottom: 10px; }
        #status { font-size: 14px; color: #88ffaa; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
        .connected { background: #0f0; box-shadow: 0 0 10px #0f0; }
        .disconnected { background: #f00; box-shadow: 0 0 10px #f00; }
        #info { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; font-size: 12px; font-family: monospace; }
        #inventory-panel { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: rgba(0,0,0,0.9); 
            padding: 15px; 
            border-radius: 8px; 
            border: 2px solid #00ff88; 
            display: none;
            min-width: 280px;
            max-height: 80vh;
            overflow-y: auto;
        }
        #inventory-panel h2 { font-size: 16px; color: #00ff88; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        #inventory-panel .close-btn { position: absolute; top: 8px; right: 10px; cursor: pointer; color: #888; font-size: 18px; }
        #inventory-panel .close-btn:hover { color: #fff; }
        #inventory-panel .player-stats { margin-bottom: 12px; font-size: 13px; }
        #inventory-panel .stat { margin: 4px 0; display: flex; align-items: center; }
        #inventory-panel .stat-bar { height: 8px; background: #333; border-radius: 4px; flex: 1; margin-left: 8px; overflow: hidden; }
        #inventory-panel .stat-fill { height: 100%; }
        #inventory-panel .health-fill { background: linear-gradient(90deg, #ff4444, #ff6666); }
        #inventory-panel .food-fill { background: linear-gradient(90deg, #aa8844, #cc9955); }
        #inventory-panel .xp-fill { background: linear-gradient(90deg, #44ff44, #88ff88); }
        .inv-section { margin-bottom: 12px; }
        .inv-section-title { font-size: 11px; color: #888; margin-bottom: 4px; text-transform: uppercase; }
        .inv-grid { display: grid; grid-template-columns: repeat(9, 28px); gap: 2px; }
        .inv-slot { width: 28px; height: 28px; background: #222; border: 1px solid #444; border-radius: 3px; display: flex; align-items: center; justify-content: center; position: relative; font-size: 9px; color: #fff; text-transform: capitalize; }
        .inv-slot.filled { background: #333; border-color: #666; }
        .inv-slot.held { border-color: #00ff88; box-shadow: 0 0 4px #00ff88; }
        .inv-slot .amount { position: absolute; bottom: 1px; right: 2px; font-size: 8px; color: #fff; text-shadow: 1px 1px 1px #000; }
        .armor-grid { display: grid; grid-template-columns: repeat(4, 28px); gap: 2px; }
        .armor-offhand-row { display: flex; align-items: center; gap: 10px; }
        .offhand-slot { display: flex; align-items: center; justify-content: center; }
        
        /* Camera mode buttons */
        #camera-modes {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.8);
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #00ff88;
            z-index: 100;
        }
        /* First person crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 50;
            display: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
        }
        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        #crosshair::after {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }
        .camera-btn {
            width: 40px;
            height: 40px;
            border: 2px solid #555;
            border-radius: 6px;
            background: #222;
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .camera-btn:hover {
            border-color: #00ff88;
            color: #fff;
        }
        .camera-btn.active {
            border-color: #00ff88;
            background: #00ff88;
            color: #000;
        }
        .camera-btn svg {
            width: 20px;
            height: 20px;
        }
        
        /* Player select modal */
        #player-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #player-modal.show {
            display: flex;
        }
        .modal-content {
            background: #222;
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 20px;
            min-width: 300px;
            max-height: 400px;
        }
        .modal-content h3 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .player-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .player-item {
            padding: 10px 15px;
            background: #333;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .player-item:hover {
            background: #444;
            border-left: 3px solid #00ff88;
        }
        .player-item.selected {
            background: #00ff88;
            color: #000;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }
        .modal-close:hover {
            color: #fff;
        }
        .no-players {
            color: #888;
            text-align: center;
            padding: 20px;
        }
        
        /* First person button in inventory */
        .first-person-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #333;
            border: 2px solid #00ff88;
            border-radius: 6px;
            color: #00ff88;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .first-person-btn:hover {
            background: #00ff88;
            color: #000;
        }
        
        /* Loading screen overlay */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.5s ease-out;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-screen.removed {
            display: none;
        }
        .loading-title {
            font-size: 32px;
            color: #00ff88;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #333;
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-status {
            font-size: 16px;
            color: #888;
            margin-bottom: 10px;
        }
        .loading-progress {
            width: 300px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc66);
            width: 0%;
            transition: width 0.3s ease-out;
            border-radius: 4px;
        }
        .loading-chunks {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Loading screen overlay -->
    <div id="loading-screen">
        <div class="loading-title">🗺️ McGPS Viewer</div>
        <div class="loading-spinner"></div>
        <div class="loading-status" id="loading-status">Connecting to server...</div>
        <div class="loading-progress">
            <div class="loading-progress-bar" id="loading-progress-bar"></div>
        </div>
        <div class="loading-chunks" id="loading-chunks">0 chunks loaded</div>
    </div>
    
    <div id="canvas-container"></div>
    
    <!-- First person crosshair -->
    <div id="crosshair"></div>
    
    <!-- Camera mode buttons -->
    <div id="camera-modes">
        <button class="camera-btn" id="btn-2d" title="2D Top-Down View">2D</button>
        <button class="camera-btn active" id="btn-freecam" title="Free Camera">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </button>
        <button class="camera-btn" id="btn-firstperson" title="First Person View">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
        <button class="camera-btn" id="btn-thirdperson" title="Third Person View (GTA-style)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
    </div>
    
    <!-- Player selection modal -->
    <div id="player-modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closePlayerModal()">&times;</span>
            <h3 id="modal-title">👁️ Select Player to Follow</h3>
            <div class="player-list" id="player-list"></div>
        </div>
    </div>
    
    <div id="ui">
        <h1>McGPS Viewer</h1>
        <div id="status"><span class="dot disconnected" id="dot"></span><span id="status-text">Connecting...</span></div>
    </div>
    <div id="info">
        <div>World: <span id="current-world">world</span></div>
        <div>FPS: <span id="fps">0</span></div>
        <div>Blocks: <span id="block-count">0</span></div>
        <div>Rendered: <span id="rendered-chunks">0</span></div>
        <div>Players: <span id="player-count">0</span></div>
        <div>Camera: <span id="camera-pos">0, 0, 0</span></div>
    </div>
    <div id="inventory-panel">
        <span class="close-btn" onclick="closeInventoryPanel()">&times;</span>
        <h2 id="inv-player-name">Player Inventory</h2>
        <div class="player-stats">
            <div class="stat">❤️ Health <div class="stat-bar"><div class="stat-fill health-fill" id="health-bar"></div></div></div>
            <div class="stat">🍖 Food <div class="stat-bar"><div class="stat-fill food-fill" id="food-bar"></div></div></div>
            <div class="stat">✨ Level <span id="player-level" style="margin-left:8px;color:#88ff88">0</span></div>
        </div>
        <div class="inv-section">
            <div class="inv-section-title">Armor & Offhand</div>
            <div class="armor-offhand-row">
                <div class="armor-grid" id="inv-armor"></div>
                <div class="offhand-slot" id="inv-offhand"></div>
            </div>
        </div>
        <div class="inv-section">
            <div class="inv-section-title">Inventory</div>
            <div class="inv-grid" id="inv-main"></div>
        </div>
        <div class="inv-section">
            <div class="inv-section-title">Hotbar</div>
            <div class="inv-grid" id="inv-hotbar"></div>
        </div>
        <button class="first-person-btn" id="inv-firstperson-btn" onclick="followSelectedPlayer()">
            First Person View
        </button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 100, 300);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Try to restore camera position from localStorage
        let yaw, pitch;
        const savedCamera = localStorage.getItem('mcgps_camera');
        if (savedCamera) {
            try {
                const camData = JSON.parse(savedCamera);
                camera.position.set(camData.x, camData.y, camData.z);
                yaw = camData.yaw;
                pitch = camData.pitch;
                camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                console.log('Restored camera position from localStorage');
            } catch (e) {
                // Fall back to default
                camera.position.set(0, 100, -100);
                yaw = Math.PI;
                pitch = 0;
            }
        } else {
            camera.position.set(0, 100, -100);
            // Calculate initial yaw and pitch to look at origin
            const initialTarget = new THREE.Vector3(0, 70, 0);
            const dx = initialTarget.x - camera.position.x;
            const dz = initialTarget.z - camera.position.z;
            yaw = Math.atan2(dx, dz) + Math.PI;
            pitch = 0; // Look horizontally
        }
        
        // Apply initial rotation
        camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        
        // Save camera position periodically
        function saveCameraPosition() {
            const camData = {
                x: camera.position.x,
                y: camera.position.y,
                z: camera.position.z,
                yaw: yaw,
                pitch: pitch
            };
            localStorage.setItem('mcgps_camera', JSON.stringify(camData));
        }
        
        // Save camera position every 2 seconds and on page unload
        setInterval(saveCameraPosition, 2000);
        window.addEventListener('beforeunload', saveCameraPosition);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: false,  // Disable for performance
            powerPreference: 'high-performance',
            stencil: false,    // Not needed, saves memory
            depth: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1); // Force 1:1 pixel ratio for performance (was capped at 2)
        renderer.sortObjects = false; // Disable sorting since we handle transparency manually
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Cache frequently accessed DOM elements for performance
        const DOM = {
            fps: document.getElementById('fps'),
            blockCount: document.getElementById('block-count'),
            renderedChunks: document.getElementById('rendered-chunks'),
            playerCount: document.getElementById('player-count'),
            cameraPos: document.getElementById('camera-pos'),
            crosshair: document.getElementById('crosshair'),
            currentWorld: document.getElementById('current-world')
        };
        
        // Throttle camera position display updates
        let lastCameraPosUpdate = 0;
        let lastCameraPosText = '';
        function updateCameraPosDisplay(text) {
            const now = performance.now();
            if (text !== lastCameraPosText && now - lastCameraPosUpdate > 100) {
                DOM.cameraPos.textContent = text;
                lastCameraPosText = text;
                lastCameraPosUpdate = now;
            }
        }

        // Player selection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedPlayerUuid = null;
        const playerData = new Map(); // Store latest player data including inventory
        
        // Camera mode: 'freecam' (default), '2d', 'firstperson', 'thirdperson'
        let cameraMode = 'freecam';
        let followTarget = null; // UUID of player being followed
        let pendingCameraMode = null; // Mode waiting for player selection
        let saved2DState = null; // Save freecam state when switching to 2D
        
        // Highlight material for selected player
        const highlightMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88, linewidth: 2 });

        // Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(100, 200, 100);
        scene.add(sun);

        // Camera controls
        let isDragging = false, lastX = 0, lastY = 0;
        let clickStartX = 0, clickStartY = 0;
        const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };

        renderer.domElement.addEventListener('mousedown', e => {
            if (e.button === 0) { 
                isDragging = true; 
                lastX = e.clientX; 
                lastY = e.clientY;
                clickStartX = e.clientX;
                clickStartY = e.clientY;
                renderer.domElement.style.cursor = 'grabbing';
            }
        });
        
        renderer.domElement.addEventListener('mouseup', (e) => {
            // Check if this was a click (not a drag)
            const dragDistance = Math.sqrt(
                Math.pow(e.clientX - clickStartX, 2) + 
                Math.pow(e.clientY - clickStartY, 2)
            );
            
            if (dragDistance < 5) {
                // This is a click - check for player selection
                handlePlayerClick(e);
            }
            
            isDragging = false;
            renderer.domElement.style.cursor = 'default';
        });
        
        renderer.domElement.addEventListener('mouseleave', () => {
            isDragging = false;
            renderer.domElement.style.cursor = 'default';
        });
        
        renderer.domElement.addEventListener('mousemove', e => {
            if (isDragging && cameraMode === 'freecam') {
                const deltaX = e.clientX - lastX;
                const deltaY = e.clientY - lastY;
                
                lastX = e.clientX;
                lastY = e.clientY;
                
                yaw -= deltaX * 0.003;
                pitch -= deltaY * 0.003;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            } else if (isDragging && cameraMode === '2d') {
                // Pan in 2D mode
                const deltaX = e.clientX - lastX;
                const deltaY = e.clientY - lastY;
                
                lastX = e.clientX;
                lastY = e.clientY;
                
                camera.position.x -= deltaX * 0.5;
                camera.position.z -= deltaY * 0.5;
            }
        });

        window.addEventListener('keydown', e => { 
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            if (key === ' ') keys.space = true;
        });
        
        window.addEventListener('keyup', e => { 
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
            if (key === ' ') keys.space = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Reusable objects for updateCamera (avoid allocations each frame)
        const tempForward = new THREE.Vector3();
        const tempRight = new THREE.Vector3();
        const tempEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        const tempQuat = new THREE.Quaternion();

        function updateCamera() {
            // Handle different camera modes
            if (cameraMode === 'firstperson' && followTarget) {
                // First person: camera inside player's head, looking through their eyes
                const targetData = playerData.get(followTarget);
                const targetPlayer = players.get(followTarget);
                
                // Hide the player model we're viewing from
                if (targetPlayer) {
                    targetPlayer.group.visible = false;
                    
                    // Use interpolated position for smooth camera movement
                    const playerYaw = targetPlayer.currentYaw + Math.PI;
                    const playerPitch = -targetPlayer.currentPitch;
                    
                    // Apply sneaking offset to camera height
                    const sneakOffset = targetPlayer.sneakYOffset || 0;
                    const eyeHeight = targetPlayer.isSneaking ? 0.85 : 1.0;
                    
                    // Position camera at player's eye level using interpolated position
                    camera.position.set(
                        targetPlayer.currentX - 0.5, 
                        targetPlayer.currentY + eyeHeight + sneakOffset, 
                        targetPlayer.currentZ - 0.5
                    );
                    
                    // Smoothly interpolate camera rotation using cached quaternion
                    tempEuler.set(playerPitch, playerYaw, 0);
                    tempQuat.setFromEuler(tempEuler);
                    camera.quaternion.slerp(tempQuat, 0.5);
                }
                
                // Show crosshair in first person
                DOM.crosshair.style.display = 'block';
                
                updateCameraPosDisplay(`👁️ First Person: ${targetData?.name || 'Unknown'}`);
                return;
            } else {
                // Make sure all players are visible when not in first person
                players.forEach((player, uuid) => {
                    player.group.visible = true;
                });
                // Hide crosshair when not in first person
                DOM.crosshair.style.display = 'none';
            }
            
            if (cameraMode === 'thirdperson' && followTarget) {
                // Third person (GTA-style): camera behind and above the player
                const targetPlayer = players.get(followTarget);
                const targetData = playerData.get(followTarget);
                if (targetPlayer) {
                    const playerYaw = targetPlayer.currentYaw + Math.PI;
                    
                    // Apply sneaking offset
                    const sneakOffset = targetPlayer.sneakYOffset || 0;
                    const distance = targetPlayer.isSneaking ? 4 : 5; // Closer when sneaking
                    const height = targetPlayer.isSneaking ? 2 : 3;   // Lower when sneaking
                    
                    const offsetX = Math.sin(playerYaw) * distance;
                    const offsetZ = Math.cos(playerYaw) * distance;
                    
                    // Use interpolated position for smooth following
                    const targetCamX = targetPlayer.currentX + offsetX;
                    const targetCamY = targetPlayer.currentY + height + sneakOffset;
                    const targetCamZ = targetPlayer.currentZ + offsetZ;
                    
                    // Smooth camera movement
                    camera.position.x = lerp(camera.position.x, targetCamX, 0.1);
                    camera.position.y = lerp(camera.position.y, targetCamY, 0.1);
                    camera.position.z = lerp(camera.position.z, targetCamZ, 0.1);
                    
                    // Look at the player's head
                    camera.lookAt(targetPlayer.currentX, targetPlayer.currentY + 1.6 + sneakOffset, targetPlayer.currentZ);
                }
                updateCameraPosDisplay(`🎮 Third Person: ${targetData?.name || 'Unknown'}`);
                return;
            }
            
            if (cameraMode === '2d') {
                // 2D mode: only horizontal movement, looking straight down
                const moveSpeed = 1.0;
                
                // In 2D mode, WASD moves in world XZ plane
                if (keys.w) camera.position.z -= moveSpeed;
                if (keys.s) camera.position.z += moveSpeed;
                if (keys.d) camera.position.x += moveSpeed;
                if (keys.a) camera.position.x -= moveSpeed;
                // Space/Shift zoom in/out
                if (keys.space) camera.position.y += moveSpeed;
                if (keys.shift) camera.position.y = Math.max(50, camera.position.y - moveSpeed);
                
                // Camera always looks straight down - use cached euler
                tempEuler.set(-Math.PI / 2, 0, 0);
                camera.quaternion.setFromEuler(tempEuler);
                
                updateCameraPosDisplay(`2D: ${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)}`);
                return;
            }
            
            // Free cam mode (default)
            // Calculate forward direction from yaw (ignoring pitch for movement)
            // Reuse cached vectors instead of creating new ones
            tempForward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
            tempRight.set(Math.cos(yaw), 0, -Math.sin(yaw));
            const moveSpeed = 0.5;
            const verticalSpeed = 0.3;

            // Move camera based on keys
            if (keys.w) camera.position.addScaledVector(tempForward, moveSpeed);
            if (keys.s) camera.position.addScaledVector(tempForward, -moveSpeed);
            if (keys.d) camera.position.addScaledVector(tempRight, moveSpeed);
            if (keys.a) camera.position.addScaledVector(tempRight, -moveSpeed);
            if (keys.space) camera.position.y += verticalSpeed;
            if (keys.shift) camera.position.y -= verticalSpeed;

            // Update camera rotation using quaternion to avoid gimbal lock
            tempEuler.set(pitch, yaw, 0);
            camera.quaternion.setFromEuler(tempEuler);
            
            updateCameraPosDisplay(`${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)}`);
        }
        
        // Camera mode switching functions
        function setCameraMode(mode) {
            const oldMode = cameraMode;
            cameraMode = mode;
            
            // Update button states
            document.getElementById('btn-2d').classList.toggle('active', mode === '2d');
            document.getElementById('btn-freecam').classList.toggle('active', mode === 'freecam');
            document.getElementById('btn-firstperson').classList.toggle('active', mode === 'firstperson');
            document.getElementById('btn-thirdperson').classList.toggle('active', mode === 'thirdperson');
            
            if (mode === '2d') {
                // Switch to 2D mode - position camera high above looking down
                camera.position.y = 200;
                camera.quaternion.setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0, 'YXZ'));
                followTarget = null;
            } else if (mode === 'freecam') {
                // Back to free cam
                followTarget = null;
                pendingCameraMode = null;
                // Restore normal view angle
                pitch = 0;
                camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            } else if (mode === 'firstperson') {
                // First person mode - need to select a player
                if (!followTarget) {
                    pendingCameraMode = 'firstperson';
                    document.getElementById('modal-title').textContent = '👁️ Select Player for First Person View';
                    openPlayerModal();
                }
            } else if (mode === 'thirdperson') {
                // Third person mode - need to select a player
                if (!followTarget) {
                    pendingCameraMode = 'thirdperson';
                    document.getElementById('modal-title').textContent = '🎮 Select Player for Third Person View';
                    openPlayerModal();
                }
            }
            
            console.log(`Camera mode: ${mode}`);
        }
        
        function openPlayerModal() {
            const modal = document.getElementById('player-modal');
            const list = document.getElementById('player-list');
            
            // Build player list
            list.innerHTML = '';
            
            if (playerData.size === 0) {
                list.innerHTML = '<div class="no-players">No players online</div>';
            } else {
                playerData.forEach((data, uuid) => {
                    const item = document.createElement('div');
                    item.className = 'player-item';
                    if (uuid === followTarget) item.classList.add('selected');
                    item.innerHTML = `<span>👤</span><span>${data.name}</span>`;
                    item.onclick = () => selectFollowTarget(uuid);
                    list.appendChild(item);
                });
            }
            
            modal.classList.add('show');
        }
        
        window.closePlayerModal = function() {
            document.getElementById('player-modal').classList.remove('show');
            // If no target selected, go back to freecam
            if (!followTarget) {
                pendingCameraMode = null;
                setCameraMode('freecam');
            }
        };
        
        function selectFollowTarget(uuid) {
            followTarget = uuid;
            document.getElementById('player-modal').classList.remove('show');
            // Apply the pending camera mode
            const mode = pendingCameraMode || 'firstperson';
            pendingCameraMode = null;
            setCameraMode(mode);
            console.log(`Following player in ${mode}: ${playerData.get(uuid)?.name}`);
        }
        
        window.followSelectedPlayer = function() {
            if (selectedPlayerUuid) {
                followTarget = selectedPlayerUuid;
                setCameraMode('firstperson');
            }
        };
        
        // Setup camera mode button handlers - clicking active button deactivates it (returns to freecam)
        document.getElementById('btn-2d').addEventListener('click', () => {
            if (cameraMode === '2d') {
                setCameraMode('freecam');
            } else {
                setCameraMode('2d');
            }
        });
        document.getElementById('btn-freecam').addEventListener('click', () => setCameraMode('freecam'));
        document.getElementById('btn-firstperson').addEventListener('click', () => {
            if (cameraMode === 'firstperson') {
                setCameraMode('freecam');
            } else {
                setCameraMode('firstperson');
            }
        });
        document.getElementById('btn-thirdperson').addEventListener('click', () => {
            if (cameraMode === 'thirdperson') {
                setCameraMode('freecam');
            } else {
                setCameraMode('thirdperson');
            }
        });
        
        // ESC key to exit first person / 2D modes
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (cameraMode !== 'freecam') {
                    setCameraMode('freecam');
                }
                closePlayerModal();
            }
        });

        // Create canvas-based textures for Minecraft-style blocks
        function createMinecraftTexture(colorData, size = 16) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Draw pixels from color data
            const imageData = ctx.createImageData(size, size);
            for (let i = 0; i < colorData.length; i++) {
                imageData.data[i] = colorData[i];
            }
            ctx.putImageData(imageData, 0, 0);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        // Track which textures loaded successfully
        const loadedRealTextures = new Set();
        const failedTextures = new Set();
        
        // Load a real texture with fallback
        function loadRealTexture(internalName) {
            return new Promise((resolve) => {
                const filename = TEXTURE_FILE_MAP[internalName];
                if (!filename) {
                    resolve(null); // No mapping, use procedural
                    return;
                }
                
                const url = `${TEXTURES_PATH}${filename}.png`;
                textureLoader.load(
                    url,
                    (texture) => {
                        // Success - configure texture for pixel art
                        texture.magFilter = THREE.NearestFilter;
                        texture.minFilter = THREE.NearestFilter;
                        texture.wrapS = THREE.RepeatWrapping;
                        texture.wrapT = THREE.RepeatWrapping;
                        texture.colorSpace = THREE.SRGBColorSpace;
                        loadedRealTextures.add(internalName);
                        resolve(texture);
                    },
                    undefined, // Progress callback (not used)
                    () => {
                        // Error - texture file not found
                        failedTextures.add(internalName);
                        resolve(null);
                    }
                );
            });
        }
        
        // Generate procedural Minecraft-style textures (fallback)
        function generateBlockTextures() {
            const textures = {};
            
            // Helper to create noise pattern
            function addNoise(ctx, baseColor, intensity, size) {
                const imageData = ctx.getImageData(0, 0, size, size);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * intensity;
                    data[i] = Math.max(0, Math.min(255, data[i] + noise));
                    data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise));
                    data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise));
                }
                ctx.putImageData(imageData, 0, 0);
            }
            
            // Helper to create a texture from a pattern function
            function createTexture(patternFn, size = 16) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                patternFn(ctx, size);
                const texture = new THREE.CanvasTexture(canvas);
                texture.magFilter = THREE.NearestFilter;
                texture.minFilter = THREE.NearestFilter;
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.colorSpace = THREE.SRGBColorSpace;
                return texture;
            }
            
            // Grass top texture
            textures.grass_top = createTexture((ctx, size) => {
                ctx.fillStyle = '#5D9B3E';
                ctx.fillRect(0, 0, size, size);
                // Add grass variation
                for (let x = 0; x < size; x++) {
                    for (let y = 0; y < size; y++) {
                        if (Math.random() > 0.6) {
                            const shade = Math.random() * 30 - 15;
                            ctx.fillStyle = `rgb(${93 + shade}, ${155 + shade}, ${62 + shade})`;
                            ctx.fillRect(x, y, 1, 1);
                        }
                    }
                }
            });
            
            // Grass side texture (dirt with grass on top)
            textures.grass_side = createTexture((ctx, size) => {
                // Dirt base
                ctx.fillStyle = '#8B6F47';
                ctx.fillRect(0, 0, size, size);
                // Add dirt variation
                for (let x = 0; x < size; x++) {
                    for (let y = 3; y < size; y++) {
                        if (Math.random() > 0.5) {
                            const shade = Math.random() * 20 - 10;
                            ctx.fillStyle = `rgb(${139 + shade}, ${111 + shade}, ${71 + shade})`;
                            ctx.fillRect(x, y, 1, 1);
                        }
                    }
                }
                // Grass top edge
                for (let x = 0; x < size; x++) {
                    const height = Math.floor(Math.random() * 3) + 1;
                    for (let y = 0; y < height; y++) {
                        const shade = Math.random() * 20 - 10;
                        ctx.fillStyle = `rgb(${93 + shade}, ${155 + shade}, ${62 + shade})`;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            });
            
            // Dirt texture
            textures.dirt = createTexture((ctx, size) => {
                ctx.fillStyle = '#8B6F47';
                ctx.fillRect(0, 0, size, size);
                for (let x = 0; x < size; x++) {
                    for (let y = 0; y < size; y++) {

            // Stone texture
            textures.stone = createTexture((ctx, size) => {

                    for (let y = 0; y < size; y++) {
                        const shade = Math.random() * 40 - 20;
                        if (Math.random() > 0.7) {
                            ctx.fillStyle = `rgb(${128 + shade - 20}, ${128 + shade - 20}, ${128 + shade - 20})`;

                const stoneColors = ['#7A7A7A', '#6B6B6B', '#5C5C5C', '#4D4D4D'];
                for (let i = 0; i < 8; i++) {
                    const x = Math.random() * (size - 4);
                    const y = Math.random() * (size - 4);
                    const w = 3 + Math.random() * 4;
                    const h = 3 + Math.random() * 4;
                    ctx.fillStyle = stoneColors[Math.floor(Math.random() * stoneColors.length)];

        // Texture animation state
        class TextureAnimation {
            constructor(textureName, config) {
                this.textureName = textureName;
                this.config = config;
                this.frameTime = config.frametime * 50; // Convert to milliseconds (50ms per tick)
                this.frameDelta = 0;
                this.frameIndex = 0;

                this.frameHeight = 1;

                if (!texture || !texture.image) return;
                
                const width = texture.image.width;
                const height = texture.image.height;
                
                // Validate dimensions
                if (width <= 0 || height <= 0) {
                    console.warn(`Invalid texture dimensions for ${this.textureName}: ${width}x${height}`);
                    return;
                }
                
                // Check if texture is animated (height > width means multiple frames stacked vertically)
                if (height > width) {
                    this.frames = Math.floor(height / width);
                    this.frameHeight = 1 / this.frames;
                    this.isAnimated = true;
                    console.log(`✓ Animated texture detected: ${this.textureName} (${this.frames} frames)`);
                }

                if (!this.isAnimated || !material || !material.map) return;
                
                this.frameDelta += delta;
                
                // Handle multiple frame advances for lag compensation
                // Limit to max 10 frame skips to prevent excessive updates
                let framesAdvanced = 0;
                const maxFrameSkip = 10;
                
                while (this.frameDelta >= this.frameTime && framesAdvanced < maxFrameSkip) {
                    this.frameDelta -= this.frameTime;
                    this.frameIndex = (this.frameIndex + 1) % this.frames;
                    framesAdvanced++;
                }
                
                // If we still have excess time (very long lag), just skip it
                if (this.frameDelta >= this.frameTime) {
                    this.frameDelta = 0;
                }
                
                // Update texture offset once after calculating final frame

                    material.map.offset.y = this.frameIndex * this.frameHeight;
                    material.map.needsUpdate = true;

        // ========== PRIORITY CHUNK LOADING SYSTEM ==========

        class ChunkLoadQueue {
            constructor() {
                this.queue = [];

                this.frameDelay = 16; // ~60fps
                this.recentChunks = []; // Track recently added chunks for adjacent rebuild

            // Add chunk with priority (lower = higher priority)
            add(chunkData, priority = 0) {
                // Check if already queued
                const key = `${chunkData.chunkX},${chunkData.chunkZ}`;
                const existing = this.queue.findIndex(c => 
                    `${c.chunkX},${c.chunkZ}` === key && c.world === chunkData.world
                );
                
                if (existing >= 0) {
                    // Update priority if new one is higher
                    if (priority < this.queue[existing].priority) {
                        this.queue[existing].priority = priority;
                        this.queue.sort((a, b) => a.priority - b.priority);
                    }
                    return;
                }
                
                this.queue.push({ ...chunkData, priority });
                this.queue.sort((a, b) => a.priority - b.priority);
                
                if (!this.processing) {
                    this.processQueue();
                }
            }
            
            // Process chunks in batches
            processQueue() {
                if (this.queue.length === 0) {
                    this.processing = false;
                    // Batch complete - rebuild adjacent chunks to fix water seams
                    this.rebuildAdjacentChunks();
                    return;
                }
                
                this.processing = true;
                
                // Track which chunks we're adding this batch (for adjacent rebuild)
                const batch = this.queue.splice(0, this.batchSize);
                batch.forEach(chunk => {
                    if (chunk.world === currentWorld) {
                        addChunkImmediate(chunk.chunkX, chunk.chunkZ, chunk.blocks, chunk.world);
                        // Track for adjacent rebuild
                        this.recentChunks.push({ chunkX: chunk.chunkX, chunkZ: chunk.chunkZ });
                    } else {

                if (this.recentChunks.length === 0) return;
                
                const adjacentToRebuild = new Set();
                
                this.recentChunks.forEach(({ chunkX, chunkZ }) => {
                    // Check all 4 adjacent chunks

                        getChunkKey2D(chunkX - 1, chunkZ),
                        getChunkKey2D(chunkX + 1, chunkZ),
                        getChunkKey2D(chunkX, chunkZ - 1),

                        if (adjChunk) {

                            if (!wasJustAdded) {

                return Math.sqrt(dx * dx + dz * dz);

            clear() {
                this.queue = [];
                this.recentChunks = [];
            }
            
            get length() {

            }
        }

            if (localY === 0) markSectionDirty(`${cx},${cy - 1},${cz}`);

            // Check for specific face texture
            if (faceType === 'top' && mapping.top) return mapping.top;
            if (faceType === 'bottom' && mapping.bottom) return mapping.bottom;
            if (faceType === 'side' && mapping.side) return mapping.side;
            if (faceType === 'front' && mapping.front) return mapping.front;
            // Fallback to side or first available
            return mapping.side || mapping.top || Object.values(mapping)[0];
        }

        // Build optimized geometry for a chunk with textures
        function buildChunkMesh(blocks, blockMap) {
            // Group blocks by texture (not just type) for batching
            // This allows different faces of same block type to use different textures
            const byTexture = {};
            
            // Transparent block types that need special handling (not culled by opaque neighbors)
            const transparentTypes = new Set([
                'water', 'lava', 'glass', 'ice', 'packed_ice', 'blue_ice',
                'leaves', 'oak_leaves', 'spruce_leaves', 'birch_leaves', 
                'jungle_leaves', 'acacia_leaves', 'dark_oak_leaves', 
                'mangrove_leaves', 'cherry_leaves', 'azalea_leaves'
            ]);
            
            // Liquid types that behave like water (flow together)
            const liquidTypes = new Set(['water', 'lava']);
            
            blocks.forEach(({ x, y, z, type = 'stone' }) => {
                const isTransparent = transparentTypes.has(type);
                const isLiquid = liquidTypes.has(type);
                const isWater = type === 'water';
                const isLava = type === 'lava';
                
                // For each direction, check if we should render the face
                const checkFace = (dx, dy, dz, faceKey) => {
                    const adjacentKey = `${x+dx},${y+dy},${z+dz}`;
                    const adjacentType = blockMap.get(adjacentKey);
                    
                    let shouldRender = false;
                    
                    if (isLiquid) {
                        // Liquids: only render faces adjacent to non-same-liquid blocks
                        if (!adjacentType || adjacentType !== type) {
                            shouldRender = true;
                        }
                    } else if (!adjacentType) {
                        // No block there, render face
                        shouldRender = true;
                    } else if (adjacentType === 'water' || adjacentType === 'lava') {
                        // Solid block next to liquid - always render this face
                        shouldRender = true;
                    } else if (isTransparent) {
                        // For transparent blocks, only cull if adjacent is same type
                        if (adjacentType !== type) {
                            shouldRender = true;
                        }
                    }
                    
                    if (shouldRender) {
                        const faceData = FACE_DATA[faceKey];
                        const textureName = getTextureForFace(type, faceData.texType);
                        
                        if (!byTexture[textureName]) {
                            byTexture[textureName] = { blocks: [], isLiquid: isLiquid, isTransparent: isTransparent, blockType: type };
                        }
                        byTexture[textureName].blocks.push({ x, y, z, faceKey, type });
                    }
                };
                
                checkFace(1, 0, 0, 'px');
                checkFace(-1, 0, 0, 'nx');
                checkFace(0, 1, 0, 'py');
                checkFace(0, -1, 0, 'ny');
                checkFace(0, 0, 1, 'pz');
                checkFace(0, 0, -1, 'nz');
            });
            
            const group = new THREE.Group();
            
            // Build merged geometry per texture
            Object.entries(byTexture).forEach(([textureName, data]) => {
                const { blocks: faceBlocks, isLiquid, isTransparent } = data;
                
                // Get material for this texture
                let mat = textureMaterials[textureName];
                if (!mat) {
                    mat = textureMaterials.default;
                }
                
                // Liquid inset to prevent z-fighting with adjacent solid blocks
                const inset = isLiquid ? 0.01 : 0;
                
                // Merge all faces of this texture into one geometry
                const positions = [];
                const normals = [];
                const uvs = [];
                const indices = [];
                let vertexOffset = 0;
                
                faceBlocks.forEach(({ x, y, z, faceKey }) => {
                    const face = FACE_DATA[faceKey];
                    
                    // Add translated vertices with optional inset for liquids
                    for (let i = 0; i < 12; i += 3) {
                        positions.push(
                            face.verts[i] + x - face.norm[0] * inset,
                            face.verts[i + 1] + y - face.norm[1] * inset,
                            face.verts[i + 2] + z - face.norm[2] * inset
                        );
                    }
                    
                    // Add normals (4 vertices per face)
                    for (let i = 0; i < 4; i++) {
                        normals.push(face.norm[0], face.norm[1], face.norm[2]);
                    }
                    
                    // Add UV coordinates (4 vertices per face, 2 components each)
                    for (let i = 0; i < 8; i++) {
                        uvs.push(face.uvs[i]);
                    }
                    
                    // Add indices (2 triangles per face)
                    indices.push(
                        vertexOffset, vertexOffset + 1, vertexOffset + 2,
                        vertexOffset, vertexOffset + 2, vertexOffset + 3
                    );
                    vertexOffset += 4;
                });
                
                if (positions.length === 0) return;
                
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
                geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                geometry.setIndex(indices);
                geometry.computeBoundingSphere();
                
                const mesh = new THREE.Mesh(geometry, mat);
                mesh.matrixAutoUpdate = false; // Performance: skip matrix calc
                mesh.updateMatrix();
                group.add(mesh);
            });
            
            // Compute bounding sphere for frustum culling
            const box = new THREE.Box3();
            group.children.forEach(mesh => {
                if (mesh.geometry.boundingBox === null) {
                    mesh.geometry.computeBoundingBox();
                }
                box.union(mesh.geometry.boundingBox);
            });
            group.userData.boundingSphere = new THREE.Sphere();
            box.getBoundingSphere(group.userData.boundingSphere);
            
            return group;
        }

        // Render blocks using chunk system (legacy bulk render)
        function renderBlocks(blocks) {
            console.time('renderBlocks');
            
            // Clear existing data
            loadedChunkData.clear();
            globalBlockMap.clear();
            
            // Group blocks by 2D chunk
            const chunkBlocks = new Map();
            blocks.forEach(b => {
                const chunkX = Math.floor(b.x / CHUNK_SIZE);
                const chunkZ = Math.floor(b.z / CHUNK_SIZE);
                const key = getChunkKey2D(chunkX, chunkZ);
                if (!chunkBlocks.has(key)) {
                    chunkBlocks.set(key, { chunkX, chunkZ, blocks: [] });
                }
                chunkBlocks.get(key).blocks.push(b);
                globalBlockMap.set(`${b.x},${b.y},${b.z}`, b.type);
            });
            
            // Store and render each chunk
            chunkBlocks.forEach((chunkInfo, key) => {
                loadedChunkData.set(key, chunkInfo);
            });
            
            rebuildAllChunks();
            
            console.timeEnd('renderBlocks');
            console.log(`Rendered ${blocks.length} blocks in ${chunkMeshes.size} chunks`);
        }
        
        // Switch to a different world (hide current, show target)
        function switchToWorld(worldName) {
            if (worldName === currentWorld) return;
            
            console.log(`Switching from ${currentWorld} to ${worldName}`);
            
            // Show loading screen for world switch if new world has no cached chunks
            const newWorldChunks = worldChunkData.get(worldName);
            if (!newWorldChunks || newWorldChunks.size < MIN_CHUNKS_TO_SHOW) {
                showLoadingScreen();
            }
            
            // Get current world's meshes BEFORE updating currentWorld
            const oldWorldMeshes = worldChunkMeshes.get(currentWorld);
            
            // Hide and remove current world's meshes from scene
            if (oldWorldMeshes) {
                console.log(`Hiding ${oldWorldMeshes.size} meshes from ${currentWorld}`);
                oldWorldMeshes.forEach((mesh, key) => {
                    mesh.visible = false;
                    if (mesh.parent) {
                        chunkGroup.remove(mesh);
                    }
                });
            }
            
            // Update current world and save to localStorage
            currentWorld = worldName;
            saveCurrentWorld();
            DOM.currentWorld.textContent = worldName;
            
            // Ensure maps exist for the new world
            if (!worldChunkData.has(worldName)) {
                worldChunkData.set(worldName, new Map());
            }
            if (!worldBlockMaps.has(worldName)) {
                worldBlockMaps.set(worldName, new Map());
            }
            if (!worldChunkMeshes.has(worldName)) {
                worldChunkMeshes.set(worldName, new Map());
            }
            
            // Update references to new world's data
            loadedChunkData = worldChunkData.get(worldName);
            globalBlockMap = worldBlockMaps.get(worldName);
            chunkMeshes = worldChunkMeshes.get(worldName);
            
            console.log(`New world state: ${loadedChunkData.size} cached chunks, ${chunkMeshes.size} existing meshes`);
            
            // Always rebuild meshes from chunk data to ensure consistency
            if (loadedChunkData.size > 0) {
                // Clear existing meshes first
                chunkMeshes.forEach((mesh, key) => {
                    if (mesh.parent) chunkGroup.remove(mesh);
                    mesh.traverse(obj => {
                        if (obj.geometry) obj.geometry.dispose();
                    });
                });
                chunkMeshes.clear();
                
                console.log(`Rebuilding meshes for ${loadedChunkData.size} cached chunks in ${worldName}...`);
                loadedChunkData.forEach((chunkInfo, key2D) => {
                    if (chunkInfo.blocks && chunkInfo.blocks.length > 0) {
                        buildAndAddChunkMesh(key2D, chunkInfo.blocks);
                    }
                });
                console.log(`Built ${chunkMeshes.size} meshes for ${worldName}`);
            }
            
            console.log(`Switched to ${worldName} - ${loadedChunkData.size} chunks, ${chunkMeshes.size} meshes, chunkGroup has ${chunkGroup.children.length} children`);
            
            // Reset camera position for new world
            initialCameraPositioned = false;
            if (loadedChunkData.size >= 4) {
                positionCameraToViewChunks();
                initialCameraPositioned = true;
            }
            
            updateBlockCount();
            
            // Update loading progress and hide if enough chunks
            updateLoadingProgress(loadedChunkData.size);
            if (loadedChunkData.size >= MIN_CHUNKS_TO_SHOW) {
                hideLoadingScreen();
            }
        }
        
        // Add a single chunk of blocks (incremental loading)
        // Uses direct add for simplicity and correct water seam handling
        function addChunk(chunkX, chunkZ, blocks, worldName = 'world') {
            // If chunk is for a different world, store it there but don't display
            if (worldName !== currentWorld) {
                storeChunkData(chunkX, chunkZ, blocks, worldName);
                return;
            }
            
            const key = getChunkKey2D(chunkX, chunkZ);
            
            // Store chunk data
            loadedChunkData.set(key, { chunkX, chunkZ, blocks });
            
            // Add blocks to global map
            blocks.forEach(b => {
                globalBlockMap.set(`${b.x},${b.y},${b.z}`, b.type);
            });
            
            // Build mesh for this chunk
            buildAndAddChunkMesh(key, blocks);
            
            // Rebuild adjacent chunks to fix water seams at boundaries
            const adjacentKeys = [
                getChunkKey2D(chunkX - 1, chunkZ),
                getChunkKey2D(chunkX + 1, chunkZ),
                getChunkKey2D(chunkX, chunkZ - 1),
                getChunkKey2D(chunkX, chunkZ + 1)
            ];
            
            adjacentKeys.forEach(adjKey => {
                const adjChunk = loadedChunkData.get(adjKey);
                if (adjChunk) {
                    // Rebuild adjacent chunk with updated block map
                    buildAndAddChunkMesh(adjKey, adjChunk.blocks);
                }
            });
            
            updateBlockCount();
            
            // Update loading progress
            updateLoadingProgress(loadedChunkData.size);
            
            // Position camera on first chunk if not already positioned
            if (!initialCameraPositioned && loadedChunkData.size >= 4) {
                positionCameraToViewChunks();
                initialCameraPositioned = true;
            }
            
            // Hide loading screen when enough chunks are loaded
            if (loadedChunkData.size >= MIN_CHUNKS_TO_SHOW && !isLoadingComplete) {
                hideLoadingScreen();
            }
        }
        
        // Legacy addChunk for direct adding (used internally after queue processing)
        function addChunkDirect(chunkX, chunkZ, blocks, worldName = 'world') {
            // If chunk is for a different world, store it there but don't display
            if (worldName !== currentWorld) {

            // Store chunk data
            loadedChunkData.set(key, { chunkX, chunkZ, blocks });
            
            // Add blocks to global map
            blocks.forEach(b => {
                globalBlockMap.set(`${b.x},${b.y},${b.z}`, b.type);
            });
            
            // Build mesh for this chunk
            buildAndAddChunkMesh(key, blocks);
            
            // Rebuild adjacent chunks to fix water seams at boundaries
            const adjacentKeys = [
                getChunkKey2D(chunkX - 1, chunkZ),
                getChunkKey2D(chunkX + 1, chunkZ),
                getChunkKey2D(chunkX, chunkZ - 1),
                getChunkKey2D(chunkX, chunkZ + 1)
            ];
            
            adjacentKeys.forEach(adjKey => {
                const adjChunk = loadedChunkData.get(adjKey);
                if (adjChunk) {
                    // Rebuild adjacent chunk with updated block map
                    buildAndAddChunkMesh(adjKey, adjChunk.blocks);
                }
            });
            
            updateBlockCount();
            
            // Update loading progress
            updateLoadingProgress(loadedChunkData.size);
            
            // Position camera on first chunk if not already positioned
            if (!initialCameraPositioned && loadedChunkData.size >= 4) {
                positionCameraToViewChunks();

            }
            
            // Hide loading screen when enough chunks are loaded

        }
        
        // Remove chunks (unload) from a specific world
        // DISABLED: Keep chunks visible on the map even when player moves away
        // The server still tracks what the player has seen, but we keep rendering them
        function removeChunks(chunks, worldName = 'world') {
            // Don't remove chunks - keep them visible on the map
            // This makes the map build up over time as the player explores
            console.log(`Ignoring unload request for ${chunks.length} chunks in ${worldName} (keeping visible)`);
            return;
        }
        
        // Update block count display
        function updateBlockCount() {
            let totalBlocks = 0;
            loadedChunkData.forEach(chunk => totalBlocks += chunk.blocks.length);
            DOM.blockCount.textContent = `${totalBlocks} (${loadedChunkData.size} chunks)`;
        }
        
        // Position camera to view all loaded chunks
        function positionCameraToViewChunks() {
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            let minZ = Infinity, maxZ = -Infinity;
            
            loadedChunkData.forEach(chunk => {
                chunk.blocks.forEach(b => {
                    minX = Math.min(minX, b.x);
                    maxX = Math.max(maxX, b.x);
                    minY = Math.min(minY, b.y);
                    maxY = Math.max(maxY, b.y);
                    minZ = Math.min(minZ, b.z);
                    maxZ = Math.max(maxZ, b.z);
                });
            });
            
            if (minX === Infinity) return;
            
            const centerX = (minX + maxX) / 2;
            const centerZ = (minZ + maxZ) / 2;
            
            // Position camera above the highest block to ensure we start above ground
            const cameraHeight = maxY + 50;
            
            camera.position.set(centerX, cameraHeight, centerZ - 80);
            
            const dx = centerX - camera.position.x;
            const dz = centerZ - camera.position.z;
            yaw = Math.atan2(dx, dz) + Math.PI;
            pitch = 0;
            
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            console.log(`Camera positioned at (${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)})`);
        }
        
        // Build and add mesh for a single chunk
        function buildAndAddChunkMesh(key2D, blocks) {
            // Group blocks by 3D chunk (Y sections)
            const chunkBlocks3D = new Map();
            blocks.forEach(block => {
                const key3D = getChunkKey(block.x, block.y, block.z);
                if (!chunkBlocks3D.has(key3D)) chunkBlocks3D.set(key3D, []);
                chunkBlocks3D.get(key3D).push(block);
            });
            
            // Build mesh for each 3D section
            chunkBlocks3D.forEach((blockList, key3D) => {
                // Remove old mesh if exists
                if (chunkMeshes.has(key3D)) {
                    const oldMesh = chunkMeshes.get(key3D);
                    chunkGroup.remove(oldMesh);
                    oldMesh.traverse(obj => {
                        if (obj.geometry) obj.geometry.dispose();
                    });
                }
                
                const mesh = buildChunkMesh(blockList, globalBlockMap);
                const [cx, cy, cz] = key3D.split(',').map(Number);
                mesh.position.set(0, 0, 0);
                mesh.userData.chunkCenter = new THREE.Vector3(
                    (cx + 0.5) * CHUNK_SIZE,
                    (cy + 0.5) * CHUNK_SIZE,
                    (cz + 0.5) * CHUNK_SIZE
                );
                chunkMeshes.set(key3D, mesh);
                chunkGroup.add(mesh);
            });
        }
        
        // Rebuild all chunk meshes from loadedChunkData
        function rebuildAllChunks() {
            // Clear old chunks
            chunkMeshes.forEach(mesh => {
                chunkGroup.remove(mesh);
                mesh.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                });
            });
            chunkMeshes.clear();
            
            // Clear dirty sections since we're rebuilding everything
            dirtySections.clear();
            
            // Rebuild each 2D chunk's 3D sections
            loadedChunkData.forEach((chunkInfo, key2D) => {
                buildAndAddChunkMesh(key2D, chunkInfo.blocks);
            });
            
            updateBlockCount();
        }
        
        // Handle real-time block changes with debounced section rebuilding
        function handleBlockChange(data) {
            const { type, x, y, z, blockType } = data;
            const key = `${x},${y},${z}`;
            const chunkX = Math.floor(x / CHUNK_SIZE);
            const chunkZ = Math.floor(z / CHUNK_SIZE);
            const key2D = getChunkKey2D(chunkX, chunkZ);
            
            if (type === 'block_break') {
                // Remove block from global map
                globalBlockMap.delete(key);
                
                // Remove from chunk data
                const chunkInfo = loadedChunkData.get(key2D);
                if (chunkInfo) {
                    chunkInfo.blocks = chunkInfo.blocks.filter(b => !(b.x === x && b.y === y && b.z === z));
                }
                console.log(`Block broken at (${x}, ${y}, ${z})`);
            } else if (type === 'block_place') {
                // Add block to global map
                if (!globalBlockMap.has(key)) {
                    globalBlockMap.set(key, blockType);
                    
                    // Add to chunk data
                    let chunkInfo = loadedChunkData.get(key2D);
                    if (!chunkInfo) {
                        chunkInfo = { chunkX, chunkZ, blocks: [] };
                        loadedChunkData.set(key2D, chunkInfo);
                    }
                    chunkInfo.blocks.push({ x, y, z, type: blockType });
                    console.log(`Block placed at (${x}, ${y}, ${z}): ${blockType}`);
                }
            }
            
            // Mark affected section + boundary neighbors as dirty (debounced rebuild)
            markSectionAndNeighborsDirty(x, y, z);
        }

        // Reusable sphere for frustum culling (avoid allocations)
        const tempSphere = new THREE.Sphere();
        let lastVisibleChunks = 0;
        let lastTotalChunks = 0;
        
        // Frustum culling update (throttled - not every frame)
        function updateFrustumCulling() {
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(projScreenMatrix);
            
            let visibleChunks = 0;
            const totalChunks = chunkMeshes.size;
            
            chunkMeshes.forEach((mesh) => {
                if (mesh.userData.boundingSphere) {
                    // Reuse temp sphere instead of cloning
                    tempSphere.copy(mesh.userData.boundingSphere);
                    tempSphere.center.add(mesh.position);
                    mesh.visible = frustum.intersectsSphere(tempSphere);
                } else {
                    mesh.visible = true;
                }
                if (mesh.visible) visibleChunks++;
            });
            
            // Only update DOM if values changed
            if (visibleChunks !== lastVisibleChunks || totalChunks !== lastTotalChunks) {
                DOM.renderedChunks.textContent = `${visibleChunks}/${totalChunks}`;
                lastVisibleChunks = visibleChunks;
                lastTotalChunks = totalChunks;
            }
        }
        
        // Handle click on player
        function handlePlayerClick(event) {
            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // Get all player meshes
            const playerMeshes = [];
            players.forEach((player, uuid) => {
                player.group.traverse(obj => {
                    if (obj.isMesh) {
                        obj.userData.playerUuid = uuid;
                        playerMeshes.push(obj);
                    }
                });
            });
            
            const intersects = raycaster.intersectObjects(playerMeshes, false);
            
            if (intersects.length > 0) {
                const clickedUuid = intersects[0].object.userData.playerUuid;
                selectPlayer(clickedUuid);
            } else {
                deselectPlayer();
            }
        }
        
        // Select a player
        function selectPlayer(uuid) {
            // Deselect previous
            if (selectedPlayerUuid && players.has(selectedPlayerUuid)) {
                removeHighlight(players.get(selectedPlayerUuid));
            }
            
            selectedPlayerUuid = uuid;
            const player = players.get(uuid);
            if (player) {
                addHighlight(player);
                showInventoryPanel(uuid);
            }
        }
        
        // Deselect current player
        function deselectPlayer() {
            if (selectedPlayerUuid && players.has(selectedPlayerUuid)) {
                removeHighlight(players.get(selectedPlayerUuid));
            }
            selectedPlayerUuid = null;
            document.getElementById('inventory-panel').style.display = 'none';
        }
        
        // Add highlight box around player
        function addHighlight(player) {
            // Create a box outline around the player
            const box = new THREE.Box3();
            box.setFromObject(player.bodyGroup);
            
            // Expand the box slightly
            box.expandByScalar(0.05);
            
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);
            
            const geometry = new THREE.BoxGeometry(size.x, size.y, size.z);
            const edges = new THREE.EdgesGeometry(geometry);
            const highlight = new THREE.LineSegments(edges, highlightMaterial);
            highlight.position.copy(center);
            highlight.position.sub(player.group.position); // Make relative to group
            highlight.name = 'playerHighlight';
            player.group.add(highlight);
        }
        
        // Remove highlight from player
        function removeHighlight(player) {
            const highlight = player.group.getObjectByName('playerHighlight');
            if (highlight) {
                player.group.remove(highlight);
                highlight.geometry.dispose();
            }
        }
        
        // Show inventory panel for player
        function showInventoryPanel(uuid) {
            const data = playerData.get(uuid);
            if (!data) return;
            
            const panel = document.getElementById('inventory-panel');
            panel.style.display = 'block';
            
            document.getElementById('inv-player-name').textContent = data.name || uuid.substring(0, 8);
            
            // Health bar (max 20)
            const healthPercent = Math.min(100, ((data.health || 0) / 20) * 100);
            document.getElementById('health-bar').style.width = healthPercent + '%';
            
            // Food bar (max 20)
            const foodPercent = Math.min(100, ((data.food || 0) / 20) * 100);
            document.getElementById('food-bar').style.width = foodPercent + '%';
            
            // Level
            document.getElementById('player-level').textContent = data.level || 0;
            
            // Inventory
            if (data.inventory) {
                renderInventorySlots('inv-hotbar', data.inventory.hotbar || [], data.inventory.heldSlot);
                renderInventorySlots('inv-main', data.inventory.main || []);
                renderArmorSlots('inv-armor', data.inventory.armor || []);
                renderOffhand('inv-offhand', data.inventory.offhand);
            }
        }
        
        // Render inventory slots
        function renderInventorySlots(containerId, items, heldSlot = -1) {

            items.forEach((item, index) => {

                        slot.appendChild(amount);

                    slot.title = item.type + (item.amount > 1 ? ` x${item.amount}` : '');
