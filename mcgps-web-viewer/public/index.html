        // Simple color materials - ALL single materials for performance
        // (Multi-material creates separate draw calls per block - very slow)
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x5ca03b }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x8b6f47 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x7f7f7f }),
            cobblestone: new THREE.MeshLambertMaterial({ color: 0x636363 }),
            sand: new THREE.MeshLambertMaterial({ color: 0xdbd3a0 }),
            gravel: new THREE.MeshLambertMaterial({ color: 0x7a7a7a }),
            water: new THREE.MeshLambertMaterial({ color: 0x3f76e4, transparent: true, opacity: 0.7 }),
            wood: new THREE.MeshLambertMaterial({ color: 0x6f5436 }),
            leaves: new THREE.MeshLambertMaterial({ color: 0x3a8d2a }),
            planks: new THREE.MeshLambertMaterial({ color: 0x9d804f }),
            snow: new THREE.MeshLambertMaterial({ color: 0xfffafa })
        };

        console.log('✓ Using optimized single-color materials');

        // Chunk-based rendering system (like Minecraft)
        const CHUNK_SIZE = 16;
        const chunkGroup = new THREE.Group();
        scene.add(chunkGroup);
        
        // Track loaded chunk data per world for caching
        const worldChunkData = new Map(); // Map<worldName, Map<chunkKey, { blocks, chunkX, chunkZ }>>
        const worldBlockMaps = new Map(); // Map<worldName, Map<blockKey, blockType>>
        const worldChunkMeshes = new Map(); // Map<worldName, Map<chunkKey, mesh>>
        
        // Current displayed world
        let currentWorld = 'world';
        
        // Helper to get chunk data for current world
        function getLoadedChunkData() {
            if (!worldChunkData.has(currentWorld)) {
                worldChunkData.set(currentWorld, new Map());
            }
            return worldChunkData.get(currentWorld);
        }
        
        // Helper to get block map for current world
        function getGlobalBlockMap() {
            if (!worldBlockMaps.has(currentWorld)) {
                worldBlockMaps.set(currentWorld, new Map());
            }
            return worldBlockMaps.get(currentWorld);
        }
        
        // Helper to get chunk meshes for current world
        function getChunkMeshes() {
            if (!worldChunkMeshes.has(currentWorld)) {
                worldChunkMeshes.set(currentWorld, new Map());
            }
            return worldChunkMeshes.get(currentWorld);
        }
        
        // Backwards compatibility references (updated when world changes)
        let loadedChunkData = getLoadedChunkData();
        let globalBlockMap = getGlobalBlockMap();
        let chunkMeshes = getChunkMeshes();
        
        const players = new Map();
        let pendingBlocks = null;
        let needsRebuild = false;
        let initialCameraPositioned = false;
        
        // Pre-computed face vertex data for speed
        const FACE_DATA = {
            px: { verts: [0.5,-0.5,-0.5, 0.5,0.5,-0.5, 0.5,0.5,0.5, 0.5,-0.5,0.5], norm: [1,0,0] },
            nx: { verts: [-0.5,-0.5,0.5, -0.5,0.5,0.5, -0.5,0.5,-0.5, -0.5,-0.5,-0.5], norm: [-1,0,0] },
            py: { verts: [-0.5,0.5,-0.5, -0.5,0.5,0.5, 0.5,0.5,0.5, 0.5,0.5,-0.5], norm: [0,1,0] },
            ny: { verts: [-0.5,-0.5,-0.5, 0.5,-0.5,-0.5, 0.5,-0.5,0.5, -0.5,-0.5,0.5], norm: [0,-1,0] },
            pz: { verts: [-0.5,-0.5,0.5, 0.5,-0.5,0.5, 0.5,0.5,0.5, -0.5,0.5,0.5], norm: [0,0,1] },
            nz: { verts: [0.5,-0.5,-0.5, -0.5,-0.5,-0.5, -0.5,0.5,-0.5, 0.5,0.5,-0.5], norm: [0,0,-1] }
        };
        
        // Frustum for culling
        const frustum = new THREE.Frustum();
        const projScreenMatrix = new THREE.Matrix4();

        // Get chunk key from world coordinates
        function getChunkKey(x, y, z) {
            const cx = Math.floor(x / CHUNK_SIZE);
            const cy = Math.floor(y / CHUNK_SIZE);
            const cz = Math.floor(z / CHUNK_SIZE);
            return `${cx},${cy},${cz}`;
        }
        
        // Get 2D chunk key (for server communication which uses x,z chunks)
        function getChunkKey2D(chunkX, chunkZ) {
            return `${chunkX},${chunkZ}`;
        }

        // Build optimized geometry for a chunk
        function buildChunkMesh(blocks, blockMap) {
            // Group blocks by type for batching
            const byType = {};
            
            // Transparent block types that need special handling
            const transparentTypes = new Set(['water', 'leaves']);
            
            blocks.forEach(({ x, y, z, type = 'stone' }) => {
                const isTransparent = transparentTypes.has(type);
                const isWater = type === 'water';
                
                // Determine visible faces (occlusion culling)
                const faces = [];
                
                // For each direction, check if we should render the face
                const checkFace = (dx, dy, dz, faceKey) => {
                    const adjacentKey = `${x+dx},${y+dy},${z+dz}`;
                    const adjacentType = blockMap.get(adjacentKey);
                    
                    if (isWater) {
                        // Water: only render faces adjacent to non-water (air or solid blocks)
                        // This creates the water surface effect
                        if (!adjacentType || (adjacentType !== 'water')) {
                            faces.push(faceKey);
                        }
                    } else if (!adjacentType) {
                        // No block there, render face
                        faces.push(faceKey);
                    } else if (adjacentType === 'water') {
                        // Solid block next to water - always render this face
                        faces.push(faceKey);
                    } else if (isTransparent) {
                        // For other transparent blocks (leaves), only cull if adjacent is same type
                        if (adjacentType !== type) {
                            faces.push(faceKey);
                        }
                    }
                    // For solid blocks next to other solid blocks, face is culled
                };
                
                checkFace(1, 0, 0, 'px');
                checkFace(-1, 0, 0, 'nx');
                checkFace(0, 1, 0, 'py');
                checkFace(0, -1, 0, 'ny');
                checkFace(0, 0, 1, 'pz');
                checkFace(0, 0, -1, 'nz');
                
                if (faces.length === 0) return; // Fully occluded
                
                if (!byType[type]) byType[type] = [];
                byType[type].push({ x, y, z, faces });
            });
            
            const group = new THREE.Group();
            
            // Build merged geometry per material type
            Object.keys(byType).forEach(type => {
                const data = byType[type];
                const mat = materials[type] || materials.stone;
                const isWater = type === 'water';
                
                // Water inset to prevent z-fighting with adjacent solid blocks
                const inset = isWater ? 0.01 : 0;
                
                // Merge all blocks of this type into one geometry
                const positions = [];
                const normals = [];
                const indices = [];
                let vertexOffset = 0;
                
                data.forEach(({ x, y, z, faces }) => {
                    faces.forEach(faceKey => {
                        const face = FACE_DATA[faceKey];
                        // Add translated vertices with optional inset for water
                        for (let i = 0; i < 12; i += 3) {
                            // Apply inset in the direction of the face normal
                            positions.push(
                                face.verts[i] + x - face.norm[0] * inset,
                                face.verts[i + 1] + y - face.norm[1] * inset,
                                face.verts[i + 2] + z - face.norm[2] * inset
                            );
                        }
                        // Add normals (4 vertices per face)
                        for (let i = 0; i < 4; i++) {
                            normals.push(face.norm[0], face.norm[1], face.norm[2]);
                        }
                        // Add indices (2 triangles per face)
                        indices.push(
                            vertexOffset, vertexOffset + 1, vertexOffset + 2,
                            vertexOffset, vertexOffset + 2, vertexOffset + 3
                        );
                        vertexOffset += 4;
                    });
                });
                
                if (positions.length === 0) return;
                
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
                geometry.setIndex(indices);
                geometry.computeBoundingSphere();
                
                const mesh = new THREE.Mesh(geometry, mat);
                mesh.matrixAutoUpdate = false; // Performance: skip matrix calc
                mesh.updateMatrix();
                group.add(mesh);
            });
            
            // Compute bounding sphere for frustum culling
            const box = new THREE.Box3();
            group.children.forEach(mesh => {
                if (mesh.geometry.boundingBox === null) {
                    mesh.geometry.computeBoundingBox();
                }
                box.union(mesh.geometry.boundingBox);
            });
            group.userData.boundingSphere = new THREE.Sphere();
            box.getBoundingSphere(group.userData.boundingSphere);
            
            return group;
        }

        // Render blocks using chunk system (legacy bulk render)
        function renderBlocks(blocks) {
            console.time('renderBlocks');
            
            // Clear existing data
            loadedChunkData.clear();
            globalBlockMap.clear();
            
            // Group blocks by 2D chunk
            const chunkBlocks = new Map();
            blocks.forEach(b => {
                const chunkX = Math.floor(b.x / CHUNK_SIZE);
                const chunkZ = Math.floor(b.z / CHUNK_SIZE);
                const key = getChunkKey2D(chunkX, chunkZ);
                if (!chunkBlocks.has(key)) {
                    chunkBlocks.set(key, { chunkX, chunkZ, blocks: [] });
                }
                chunkBlocks.get(key).blocks.push(b);
                globalBlockMap.set(`${b.x},${b.y},${b.z}`, b.type);
            });
            
            // Store and render each chunk
            chunkBlocks.forEach((chunkInfo, key) => {
                loadedChunkData.set(key, chunkInfo);
            });
            
            rebuildAllChunks();
            
            console.timeEnd('renderBlocks');
            console.log(`Rendered ${blocks.length} blocks in ${chunkMeshes.size} chunks`);
        }
        
        // Switch to a different world (hide current, show target)
        function switchToWorld(worldName) {
            if (worldName === currentWorld) return;
            
            console.log(`Switching from ${currentWorld} to ${worldName}`);
            
            // Get current world's meshes BEFORE updating currentWorld
            const oldWorldMeshes = worldChunkMeshes.get(currentWorld);
            
            // Hide and remove current world's meshes from scene
            if (oldWorldMeshes) {
                console.log(`Hiding ${oldWorldMeshes.size} meshes from ${currentWorld}`);
                oldWorldMeshes.forEach((mesh, key) => {
                    mesh.visible = false;
                    if (mesh.parent) {
                        chunkGroup.remove(mesh);
                    }
                });
            }
            
            // Update current world
            currentWorld = worldName;
            document.getElementById('current-world').textContent = worldName;
            
            // Ensure maps exist for the new world
            if (!worldChunkData.has(worldName)) {
                worldChunkData.set(worldName, new Map());
            }
            if (!worldBlockMaps.has(worldName)) {
                worldBlockMaps.set(worldName, new Map());
            }
            if (!worldChunkMeshes.has(worldName)) {
                worldChunkMeshes.set(worldName, new Map());
            }
            
            // Update references to new world's data
            loadedChunkData = worldChunkData.get(worldName);
            globalBlockMap = worldBlockMaps.get(worldName);
            chunkMeshes = worldChunkMeshes.get(worldName);
            
            console.log(`New world state: ${loadedChunkData.size} cached chunks, ${chunkMeshes.size} existing meshes`);
            
            // Always rebuild meshes from chunk data to ensure consistency
            if (loadedChunkData.size > 0) {
                // Clear existing meshes first
                chunkMeshes.forEach((mesh, key) => {
                    if (mesh.parent) chunkGroup.remove(mesh);
                    mesh.traverse(obj => {
                        if (obj.geometry) obj.geometry.dispose();
                    });
                });
                chunkMeshes.clear();
                
                console.log(`Rebuilding meshes for ${loadedChunkData.size} cached chunks in ${worldName}...`);
                loadedChunkData.forEach((chunkInfo, key2D) => {
                    if (chunkInfo.blocks && chunkInfo.blocks.length > 0) {
                        buildAndAddChunkMesh(key2D, chunkInfo.blocks);
                    }
                });
                console.log(`Built ${chunkMeshes.size} meshes for ${worldName}`);
            }
            
            console.log(`Switched to ${worldName} - ${loadedChunkData.size} chunks, ${chunkMeshes.size} meshes, chunkGroup has ${chunkGroup.children.length} children`);
            
            // Reset camera position for new world
            initialCameraPositioned = false;
            if (loadedChunkData.size >= 4) {
                positionCameraToViewChunks();
                initialCameraPositioned = true;
            }
            
            updateBlockCount();
        }
        
        // Add a single chunk of blocks (incremental loading)
        function addChunk(chunkX, chunkZ, blocks, worldName = 'world') {
            // If chunk is for a different world, store it there but don't display
            if (worldName !== currentWorld) {
                if (!worldChunkData.has(worldName)) {
                    worldChunkData.set(worldName, new Map());
                    worldBlockMaps.set(worldName, new Map());
                    worldChunkMeshes.set(worldName, new Map());
                }
                const otherChunkData = worldChunkData.get(worldName);
                const otherBlockMap = worldBlockMaps.get(worldName);
                
                const key = getChunkKey2D(chunkX, chunkZ);
                otherChunkData.set(key, { chunkX, chunkZ, blocks });
                blocks.forEach(b => {
                    otherBlockMap.set(`${b.x},${b.y},${b.z}`, b.type);
                });
                return; // Don't build mesh for non-current world
            }
            
            const key = getChunkKey2D(chunkX, chunkZ);
            
            // Store chunk data
            loadedChunkData.set(key, { chunkX, chunkZ, blocks });
            
            // Add blocks to global map
            blocks.forEach(b => {
                globalBlockMap.set(`${b.x},${b.y},${b.z}`, b.type);
            });
            
            // Build mesh for this chunk
            buildAndAddChunkMesh(key, blocks);
            
            // Rebuild adjacent chunks to fix water seams at boundaries
            const adjacentKeys = [
                getChunkKey2D(chunkX - 1, chunkZ),
                getChunkKey2D(chunkX + 1, chunkZ),
                getChunkKey2D(chunkX, chunkZ - 1),
                getChunkKey2D(chunkX, chunkZ + 1)
            ];
            
            adjacentKeys.forEach(adjKey => {
                const adjChunk = loadedChunkData.get(adjKey);
                if (adjChunk) {
                    // Rebuild adjacent chunk with updated block map
                    buildAndAddChunkMesh(adjKey, adjChunk.blocks);
                }
            });
            
            updateBlockCount();
            
            // Position camera on first chunk if not already positioned
            if (!initialCameraPositioned && loadedChunkData.size >= 4) {
                positionCameraToViewChunks();
                initialCameraPositioned = true;
            }
        }
        
        // Remove chunks (unload) from a specific world
        function removeChunks(chunks, worldName = 'world') {
            // Only process if it's the current world
            if (worldName !== currentWorld) {
                // Just remove from storage for other worlds
                const otherData = worldChunkData.get(worldName);
                const otherBlocks = worldBlockMaps.get(worldName);
                if (otherData && otherBlocks) {
                    chunks.forEach(({ x, z }) => {
                        const key = getChunkKey2D(x, z);
                        const chunkInfo = otherData.get(key);
                        if (chunkInfo) {
                            chunkInfo.blocks.forEach(b => {
                                otherBlocks.delete(`${b.x},${b.y},${b.z}`);
                            });
                            otherData.delete(key);
                        }
                    });
                }
                return;
            }
            
            chunks.forEach(({ x, z }) => {
                const key = getChunkKey2D(x, z);
                
                // Remove from data
                const chunkInfo = loadedChunkData.get(key);
                if (chunkInfo) {
                    chunkInfo.blocks.forEach(b => {
                        globalBlockMap.delete(`${b.x},${b.y},${b.z}`);
                    });
                    loadedChunkData.delete(key);
                }
                
                // Find and remove 3D chunk meshes for this 2D chunk
                const keysToRemove = [];
                chunkMeshes.forEach((mesh, meshKey) => {
                    const [cx, cy, cz] = meshKey.split(',').map(Number);
                    if (cx === x && cz === z) {
                        keysToRemove.push(meshKey);
                    }
                });
                
                keysToRemove.forEach(meshKey => {
                    const mesh = chunkMeshes.get(meshKey);
                    if (mesh) {
                        chunkGroup.remove(mesh);
                        mesh.traverse(obj => {
                            if (obj.geometry) obj.geometry.dispose();
                        });
                        chunkMeshes.delete(meshKey);
                    }
                });
            });
            
            updateBlockCount();
        }
        
        // Update block count display
        function updateBlockCount() {
            let totalBlocks = 0;
            loadedChunkData.forEach(chunk => totalBlocks += chunk.blocks.length);
            document.getElementById('block-count').textContent = `${totalBlocks} (${loadedChunkData.size} chunks)`;
        }
        
        // Position camera to view all loaded chunks
        function positionCameraToViewChunks() {
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            let minZ = Infinity, maxZ = -Infinity;
            
            loadedChunkData.forEach(chunk => {
                chunk.blocks.forEach(b => {
                    minX = Math.min(minX, b.x);
                    maxX = Math.max(maxX, b.x);
                    minY = Math.min(minY, b.y);
                    maxY = Math.max(maxY, b.y);
                    minZ = Math.min(minZ, b.z);
                    maxZ = Math.max(maxZ, b.z);
                });
            });
            
            if (minX === Infinity) return;
            
            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;
            const centerZ = (minZ + maxZ) / 2;
            
            camera.position.set(centerX, centerY + 50, centerZ - 80);
            
            const dx = centerX - camera.position.x;
            const dz = centerZ - camera.position.z;
            yaw = Math.atan2(dx, dz) + Math.PI;
            pitch = 0;
            
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            console.log(`Camera positioned at (${Math.floor(camera.position.x)}, ${Math.floor(camera.position.y)}, ${Math.floor(camera.position.z)})`);
        }
        
        // Build and add mesh for a single chunk
        function buildAndAddChunkMesh(key2D, blocks) {
            // Group blocks by 3D chunk (Y sections)
            const chunkBlocks3D = new Map();
            blocks.forEach(block => {
                const key3D = getChunkKey(block.x, block.y, block.z);
                if (!chunkBlocks3D.has(key3D)) chunkBlocks3D.set(key3D, []);
                chunkBlocks3D.get(key3D).push(block);
            });
            
            // Build mesh for each 3D section
            chunkBlocks3D.forEach((blockList, key3D) => {
                // Remove old mesh if exists
                if (chunkMeshes.has(key3D)) {
                    const oldMesh = chunkMeshes.get(key3D);
                    chunkGroup.remove(oldMesh);
                    oldMesh.traverse(obj => {
                        if (obj.geometry) obj.geometry.dispose();
                    });
                }
                
                const mesh = buildChunkMesh(blockList, globalBlockMap);
                const [cx, cy, cz] = key3D.split(',').map(Number);
                mesh.position.set(0, 0, 0);
                mesh.userData.chunkCenter = new THREE.Vector3(
                    (cx + 0.5) * CHUNK_SIZE,
                    (cy + 0.5) * CHUNK_SIZE,
                    (cz + 0.5) * CHUNK_SIZE
                );
                chunkMeshes.set(key3D, mesh);
                chunkGroup.add(mesh);
            });
        }
        
        // Rebuild all chunk meshes from loadedChunkData
        function rebuildAllChunks() {
            // Clear old chunks
            chunkMeshes.forEach(mesh => {
                chunkGroup.remove(mesh);
                mesh.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                });
            });
            chunkMeshes.clear();
            
            // Rebuild each 2D chunk's 3D sections
            loadedChunkData.forEach((chunkInfo, key2D) => {
                buildAndAddChunkMesh(key2D, chunkInfo.blocks);
            });
            
            updateBlockCount();
        }
        
        // Rebuild only affected 3D chunk section (for block changes)
        function rebuildChunk(chunkKey) {
            // Remove old chunk mesh if exists
            if (chunkMeshes.has(chunkKey)) {
                const oldMesh = chunkMeshes.get(chunkKey);
                chunkGroup.remove(oldMesh);
                oldMesh.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                });
                chunkMeshes.delete(chunkKey);
            }
            
            // Get blocks in this 3D chunk section
            const [cx, cy, cz] = chunkKey.split(',').map(Number);
            const chunkBlockList = [];
            
            // Collect from all loaded 2D chunks that overlap this 3D section
            loadedChunkData.forEach(chunkInfo => {
                chunkInfo.blocks.forEach(b => {
                    if (Math.floor(b.x / CHUNK_SIZE) === cx &&
                        Math.floor(b.y / CHUNK_SIZE) === cy &&
                        Math.floor(b.z / CHUNK_SIZE) === cz) {
                        chunkBlockList.push(b);
                    }
                });
            });
            
            if (chunkBlockList.length === 0) return;
            
            // Rebuild mesh
            const mesh = buildChunkMesh(chunkBlockList, globalBlockMap);
            mesh.position.set(0, 0, 0);
            mesh.userData.chunkCenter = new THREE.Vector3(
                (cx + 0.5) * CHUNK_SIZE,
                (cy + 0.5) * CHUNK_SIZE,
                (cz + 0.5) * CHUNK_SIZE
            );
            chunkMeshes.set(chunkKey, mesh);
            chunkGroup.add(mesh);
        }
        
        // Handle real-time block changes
        function handleBlockChange(data) {
            const { type, x, y, z, blockType } = data;
            const key = `${x},${y},${z}`;
            const chunkKey = getChunkKey(x, y, z);
            const chunkX = Math.floor(x / CHUNK_SIZE);
            const chunkZ = Math.floor(z / CHUNK_SIZE);
            const key2D = getChunkKey2D(chunkX, chunkZ);
            
            // Get adjacent chunk keys that might need updating
            const adjacentChunks = new Set([chunkKey]);
            [
                [x+1, y, z], [x-1, y, z],
                [x, y+1, z], [x, y-1, z],
                [x, y, z+1], [x, y, z-1]
            ].forEach(([ax, ay, az]) => {
                adjacentChunks.add(getChunkKey(ax, ay, az));
            });
            
            if (type === 'block_break') {
                // Remove block from global map
                globalBlockMap.delete(key);
                
                // Remove from chunk data
                const chunkInfo = loadedChunkData.get(key2D);
                if (chunkInfo) {
                    chunkInfo.blocks = chunkInfo.blocks.filter(b => !(b.x === x && b.y === y && b.z === z));
                }
                console.log(`Block broken at (${x}, ${y}, ${z})`);
            } else if (type === 'block_place') {
                // Add block to global map
                if (!globalBlockMap.has(key)) {
                    globalBlockMap.set(key, blockType);
                    
                    // Add to chunk data
                    let chunkInfo = loadedChunkData.get(key2D);
                    if (!chunkInfo) {
                        chunkInfo = { chunkX, chunkZ, blocks: [] };
                        loadedChunkData.set(key2D, chunkInfo);
                    }
                    chunkInfo.blocks.push({ x, y, z, type: blockType });
                    console.log(`Block placed at (${x}, ${y}, ${z}): ${blockType}`);
                }
            }
            
            // Rebuild affected chunks
            adjacentChunks.forEach(ck => rebuildChunk(ck));
            
            updateBlockCount();
        }

        // Frustum culling update (called each frame)
        function updateFrustumCulling() {
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(projScreenMatrix);
            
            let visibleChunks = 0;
            chunkMeshes.forEach((mesh) => {
                if (mesh.userData.boundingSphere) {
                    const sphere = mesh.userData.boundingSphere.clone();
                    sphere.center.add(mesh.position);
                    mesh.visible = frustum.intersectsSphere(sphere);
                } else {
                    mesh.visible = true;
                }
                if (mesh.visible) visibleChunks++;
            });
            
            document.getElementById('rendered-chunks').textContent = `${visibleChunks}/${chunkMeshes.size}`;
        }
        
        // Handle click on player
        function handlePlayerClick(event) {
            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // Get all player meshes
            const playerMeshes = [];
            players.forEach((player, uuid) => {
                player.group.traverse(obj => {
                    if (obj.isMesh) {
                        obj.userData.playerUuid = uuid;
                        playerMeshes.push(obj);
                    }
                });
            });
            
            const intersects = raycaster.intersectObjects(playerMeshes, false);
            
            if (intersects.length > 0) {
                const clickedUuid = intersects[0].object.userData.playerUuid;
                selectPlayer(clickedUuid);
            } else {
                deselectPlayer();
            }
        }
        
        // Select a player
        function selectPlayer(uuid) {
            // Deselect previous
            if (selectedPlayerUuid && players.has(selectedPlayerUuid)) {
                removeHighlight(players.get(selectedPlayerUuid));
            }
            
            selectedPlayerUuid = uuid;
            const player = players.get(uuid);
            if (player) {
                addHighlight(player);
                showInventoryPanel(uuid);
            }
        }
        
        // Deselect current player
        function deselectPlayer() {
            if (selectedPlayerUuid && players.has(selectedPlayerUuid)) {
                removeHighlight(players.get(selectedPlayerUuid));
            }
            selectedPlayerUuid = null;
            document.getElementById('inventory-panel').style.display = 'none';
        }
        
        // Add highlight box around player
        function addHighlight(player) {
            // Create a box outline around the player
            const box = new THREE.Box3();
            box.setFromObject(player.bodyGroup);
            
            // Expand the box slightly
            box.expandByScalar(0.05);
            
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);
            
            const geometry = new THREE.BoxGeometry(size.x, size.y, size.z);
            const edges = new THREE.EdgesGeometry(geometry);
            const highlight = new THREE.LineSegments(edges, highlightMaterial);
            highlight.position.copy(center);
            highlight.position.sub(player.group.position); // Make relative to group
            highlight.name = 'playerHighlight';
            player.group.add(highlight);
        }
        
        // Remove highlight from player
        function removeHighlight(player) {
            const highlight = player.group.getObjectByName('playerHighlight');
            if (highlight) {
                player.group.remove(highlight);
                highlight.geometry.dispose();
            }
        }
        
        // Show inventory panel for player
        function showInventoryPanel(uuid) {
            const data = playerData.get(uuid);
            if (!data) return;
            
            const panel = document.getElementById('inventory-panel');
            panel.style.display = 'block';
            
            document.getElementById('inv-player-name').textContent = data.name || uuid.substring(0, 8);
            
            // Health bar (max 20)
            const healthPercent = Math.min(100, ((data.health || 0) / 20) * 100);
            document.getElementById('health-bar').style.width = healthPercent + '%';
            
            // Food bar (max 20)
            const foodPercent = Math.min(100, ((data.food || 0) / 20) * 100);
            document.getElementById('food-bar').style.width = foodPercent + '%';
            
            // Level
            document.getElementById('player-level').textContent = data.level || 0;
            
            // Inventory
            if (data.inventory) {
                renderInventorySlots('inv-hotbar', data.inventory.hotbar || [], data.inventory.heldSlot);
                renderInventorySlots('inv-main', data.inventory.main || []);
                renderArmorSlots('inv-armor', data.inventory.armor || []);
                renderOffhand('inv-offhand', data.inventory.offhand);
            }
        }
        
        // Render inventory slots
        function renderInventorySlots(containerId, items, heldSlot = -1) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            items.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot' + (item ? ' filled' : '') + (index === heldSlot ? ' held' : '');
                
                if (item) {
                    slot.textContent = getItemShortName(item.type);
                    if (item.amount > 1) {
                        const amount = document.createElement('span');
                        amount.className = 'amount';
                        amount.textContent = item.amount;
                        slot.appendChild(amount);
                    }
                    slot.title = item.type + (item.amount > 1 ? ` x${item.amount}` : '');
                }
                
                container.appendChild(slot);
            });
        }
        
        // Render armor slots
        function renderArmorSlots(containerId, items) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const labels = ['🪖', '👕', '👖', '👢'];
            
            items.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot' + (item ? ' filled' : '');
                
                if (item) {
                    slot.textContent = getItemShortName(item.type);
                    slot.title = item.type;
                } else {
                    slot.textContent = labels[index] || '';
                    slot.style.opacity = '0.3';
                }
                
                container.appendChild(slot);
            });
        }
        
        // Render offhand slot
        function renderOffhand(containerId, item) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            const slot = document.createElement('div');
            slot.className = 'inv-slot' + (item ? ' filled' : '');
            
            if (item) {
                slot.textContent = getItemShortName(item.type);
                if (item.amount > 1) {
                    const amount = document.createElement('span');
                    amount.className = 'amount';
                    amount.textContent = item.amount;
                    slot.appendChild(amount);
                }
                slot.title = item.type + (item.amount > 1 ? ` x${item.amount}` : '');
            } else {
                slot.textContent = '🛡️';
                slot.style.opacity = '0.3';
            }
            
            container.appendChild(slot);
        }
        
        // Get short display name for item
        function getItemShortName(type) {
            if (!type) return '';
            // Remove common prefixes and shorten
            return type.replace(/_/g, ' ').split(' ').pop().substring(0, 4);
        }
        
        // Close inventory panel (exposed globally)
        window.closeInventoryPanel = function() {
            deselectPlayer();
        };

        // Create materials for each face of a body part from skin texture
        function createSkinMaterials(texture, uvMap) {
            // uvMap: { right, left, top, bottom, front, back } each with {x, y, w, h} in pixels
            // Skin is 64x64 pixels
            const materials = [];
            const faceOrder = ['right', 'left', 'top', 'bottom', 'front', 'back'];
            
            faceOrder.forEach(face => {
                const uv = uvMap[face];
                const canvas = document.createElement('canvas');
                canvas.width = uv.w;
                canvas.height = uv.h;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(texture.image, uv.x, uv.y, uv.w, uv.h, 0, 0, uv.w, uv.h);
                
                const faceTexture = new THREE.CanvasTexture(canvas);
                faceTexture.magFilter = THREE.NearestFilter;
                faceTexture.minFilter = THREE.NearestFilter;
                materials.push(new THREE.MeshLambertMaterial({ map: faceTexture }));
            });
            
            return materials;
        }
        
        // Minecraft skin UV layout (64x64 skin)
        const SKIN_UV = {
            head: {
                right:  { x: 16, y: 8,  w: 8, h: 8 },
                left:   { x: 0,  y: 8,  w: 8, h: 8 },
                top:    { x: 8,  y: 0,  w: 8, h: 8 },
                bottom: { x: 16, y: 0,  w: 8, h: 8 },
                front:  { x: 8,  y: 8,  w: 8, h: 8 },
                back:   { x: 24, y: 8,  w: 8, h: 8 }
            },
            body: {
                right:  { x: 16, y: 20, w: 4,  h: 12 },
                left:   { x: 28, y: 20, w: 4,  h: 12 },
                top:    { x: 20, y: 16, w: 8,  h: 4 },
                bottom: { x: 28, y: 16, w: 8,  h: 4 },
                front:  { x: 20, y: 20, w: 8,  h: 12 },
                back:   { x: 32, y: 20, w: 8,  h: 12 }
            },
            rightArm: {
                right:  { x: 40, y: 20, w: 4, h: 12 },
                left:   { x: 48, y: 20, w: 4, h: 12 },
                top:    { x: 44, y: 16, w: 4, h: 4 },
                bottom: { x: 48, y: 16, w: 4, h: 4 },
                front:  { x: 44, y: 20, w: 4, h: 12 },
                back:   { x: 52, y: 20, w: 4, h: 12 }
            },
            leftArm: {
                right:  { x: 32, y: 52, w: 4, h: 12 },
                left:   { x: 40, y: 52, w: 4, h: 12 },
                top:    { x: 36, y: 48, w: 4, h: 4 },
                bottom: { x: 40, y: 48, w: 4, h: 4 },
                front:  { x: 36, y: 52, w: 4, h: 12 },
                back:   { x: 44, y: 52, w: 4, h: 12 }
            },
            rightLeg: {
                right:  { x: 0,  y: 20, w: 4, h: 12 },
                left:   { x: 8,  y: 20, w: 4, h: 12 },
                top:    { x: 4,  y: 16, w: 4, h: 4 },
                bottom: { x: 8,  y: 16, w: 4, h: 4 },
                front:  { x: 4,  y: 20, w: 4, h: 12 },
                back:   { x: 12, y: 20, w: 4, h: 12 }
            },
            leftLeg: {
                right:  { x: 16, y: 52, w: 4, h: 12 },
                left:   { x: 24, y: 52, w: 4, h: 12 },
                top:    { x: 20, y: 48, w: 4, h: 4 },
                bottom: { x: 24, y: 48, w: 4, h: 4 },
                front:  { x: 20, y: 52, w: 4, h: 12 },
                back:   { x: 28, y: 52, w: 4, h: 12 }
            }
        };
        
        // Default cyan material for fallback
        const defaultMaterial = new THREE.MeshLambertMaterial({ color: 0x00ffff });
        
        function createPlayerModel(uuid, name) {
            const group = new THREE.Group();
            
            // Body group (rotates with yaw)
            const bodyGroup = new THREE.Group();
            
            // Scale: 1 block = 1 unit, player is 1.8 blocks tall
            // Minecraft player dimensions in pixels: head 8x8x8, body 8x12x4, arms 4x12x4, legs 4x12x4
            // Scale factor: 8 pixels = 0.5 blocks (head is 0.5 blocks)
            const scale = 0.5 / 8; // 0.0625 units per pixel
            
            // Positioning from ground up:
            // Legs: 0 to 0.75 (12 pixels)
            // Body: 0.75 to 1.5 (12 pixels)
            // Head: 1.5 to 2.0 (8 pixels)
            
            // Head (separate group for pitch rotation)
            const headGroup = new THREE.Group();
            headGroup.position.y = 1.5; // Position at top of body
            
            const head = new THREE.Mesh(
                new THREE.BoxGeometry(8 * scale, 8 * scale, 8 * scale),
                defaultMaterial
            );
            head.position.y = 4 * scale; // Center head (0.25 above headGroup = 1.75 total)
            headGroup.add(head);
            
            // Body - center at 1.125 (spans 0.75 to 1.5)
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(8 * scale, 12 * scale, 4 * scale),
                defaultMaterial
            );
            body.position.y = 1.125;
            bodyGroup.add(body);
            
            // Right Arm - use pivot group for rotation at shoulder
            const rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(-6 * scale, 1.5, 0); // Pivot at shoulder
            const rightArm = new THREE.Mesh(
                new THREE.BoxGeometry(4 * scale, 12 * scale, 4 * scale),
                defaultMaterial
            );
            rightArm.position.y = -6 * scale; // Offset so it rotates from top
            rightArmPivot.add(rightArm);
            bodyGroup.add(rightArmPivot);
            
            // Left Arm - use pivot group for rotation at shoulder
            const leftArmPivot = new THREE.Group();
            leftArmPivot.position.set(6 * scale, 1.5, 0); // Pivot at shoulder
            const leftArm = new THREE.Mesh(
                new THREE.BoxGeometry(4 * scale, 12 * scale, 4 * scale),
                defaultMaterial
            );
            leftArm.position.y = -6 * scale; // Offset so it rotates from top
            leftArmPivot.add(leftArm);
            bodyGroup.add(leftArmPivot);
            
            // Right Leg - use pivot group for rotation at hip
            const rightLegPivot = new THREE.Group();
            rightLegPivot.position.set(-2 * scale, 0.75, 0); // Pivot at hip
            const rightLeg = new THREE.Mesh(
                new THREE.BoxGeometry(4 * scale, 12 * scale, 4 * scale),
                defaultMaterial
            );
            rightLeg.position.y = -6 * scale; // Offset so it rotates from top
            rightLegPivot.add(rightLeg);
            bodyGroup.add(rightLegPivot);
            
            // Left Leg - use pivot group for rotation at hip
            const leftLegPivot = new THREE.Group();
            leftLegPivot.position.set(2 * scale, 0.75, 0); // Pivot at hip
            const leftLeg = new THREE.Mesh(
                new THREE.BoxGeometry(4 * scale, 12 * scale, 4 * scale),
                defaultMaterial
            );
            leftLeg.position.y = -6 * scale; // Offset so it rotates from top
            leftLegPivot.add(leftLeg);
            bodyGroup.add(leftLegPivot);
            
            bodyGroup.add(headGroup);
            group.add(bodyGroup);
            
            // Name tag (always faces camera)
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, 256, 64);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(name || uuid.substring(0, 8), 128, 42);
            
            const nameTexture = new THREE.CanvasTexture(canvas);
            const nameTag = new THREE.Mesh(
                new THREE.PlaneGeometry(1.5, 0.4),
                new THREE.MeshBasicMaterial({ map: nameTexture, transparent: true, depthTest: false })
            );
            nameTag.position.y = 2.2;
            nameTag.renderOrder = 999;
            group.add(nameTag);
            
            scene.add(group);
            
            // Load skin texture via our server proxy (bypasses CORS)
            const skinUrl = `/skin/${uuid}`;
            const loader = new THREE.TextureLoader();
            loader.crossOrigin = 'anonymous';
            loader.load(skinUrl, (texture) => {
                texture.magFilter = THREE.NearestFilter;
                texture.minFilter = THREE.NearestFilter;
                
                // Apply textured materials to each body part
                head.material = createSkinMaterials(texture, SKIN_UV.head);
                body.material = createSkinMaterials(texture, SKIN_UV.body);
                rightArm.material = createSkinMaterials(texture, SKIN_UV.rightArm);
                leftArm.material = createSkinMaterials(texture, SKIN_UV.leftArm);
                rightLeg.material = createSkinMaterials(texture, SKIN_UV.rightLeg);
                leftLeg.material = createSkinMaterials(texture, SKIN_UV.leftLeg);
            }, undefined, (err) => {
                console.log('Could not load skin for', uuid, '- using default');
            });
            
            return { 
                group, 
                bodyGroup, 
                headGroup, 
                nameTag,
                // Limb pivots for animation
                rightArmPivot,
                leftArmPivot,
                rightLegPivot,
                leftLegPivot,
                // Animation state
                walkTime: 0,
                isWalking: false,
                isSneaking: false,
                // Target position/rotation for interpolation
                targetX: 0,
                targetY: 0,
                targetZ: 0,
                targetYaw: 0,
                targetPitch: 0,
                // Current interpolated position/rotation
                currentX: 0,
                currentY: 0,
                currentZ: 0,
                currentYaw: 0,
                currentPitch: 0,
                // Previous position for speed calculation
                prevX: 0,
                prevZ: 0
            };
        }
        
        // Interpolation factor for smooth movement (higher = faster catch-up)
        const LERP_FACTOR = 0.15;
        const ROTATION_LERP = 0.2;
        
        // Lerp helper
        function lerp(a, b, t) {
            return a + (b - a) * t;
        }
        
        // Angle lerp helper (handles wrapping)
        function lerpAngle(a, b, t) {
            let diff = b - a;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            return a + diff * t;
        }
        
        function updatePlayer(data) {
            const { uuid, name, x, y, z, yaw, pitch, sneaking } = data;
            
            if (!players.has(uuid)) {
                const playerModel = createPlayerModel(uuid, name);
                // Initialize position
                playerModel.targetX = x;
                playerModel.targetY = y;
                playerModel.targetZ = z;
                playerModel.currentX = x;
                playerModel.currentY = y;
                playerModel.currentZ = z;
                playerModel.prevX = x;
                playerModel.prevZ = z;
                players.set(uuid, playerModel);
            }
            
            const player = players.get(uuid);
            
            // Update target position (from server data)
            player.targetX = x;
            player.targetY = y;
            player.targetZ = z;
            if (yaw !== undefined) player.targetYaw = -yaw * Math.PI / 180;
            if (pitch !== undefined) player.targetPitch = pitch * Math.PI / 180;
            
            // Update sneaking state (sneaking comes from server telemetry)
            player.isSneaking = data.sneaking === true;
            
            // Store player data for inventory display
            playerData.set(uuid, data);
            
            // Update inventory panel if this player is selected
            if (selectedPlayerUuid === uuid) {
                showInventoryPanel(uuid);
                // Update highlight position
                removeHighlight(player);
                addHighlight(player);
            }
            
            document.getElementById('player-count').textContent = players.size;
        }
        
        // Animate all players (called every frame)
        function animatePlayers() {
            players.forEach((player, uuid) => {
                // Interpolate position
                player.currentX = lerp(player.currentX, player.targetX, LERP_FACTOR);
                player.currentY = lerp(player.currentY, player.targetY, LERP_FACTOR);
                player.currentZ = lerp(player.currentZ, player.targetZ, LERP_FACTOR);
                
                // Interpolate rotation
                player.currentYaw = lerpAngle(player.currentYaw, player.targetYaw, ROTATION_LERP);
                player.currentPitch = lerp(player.currentPitch, player.targetPitch, ROTATION_LERP);
                
                // Calculate movement speed for animation
                const dx = player.currentX - player.prevX;
                const dz = player.currentZ - player.prevZ;
                const speed = Math.sqrt(dx * dx + dz * dz);
                
                // Update walking state
                if (speed > 0.001) {
                    player.isWalking = true;
                    // Animation speed: slower for more realistic walk cycle
                    const animSpeed = player.isSneaking ? 1.5 : 3;
                    player.walkTime += speed * animSpeed;
                } else {
                    player.isWalking = false;
                }
                
                // Walking animation - only swing when walking and NOT sneaking
                const maxSwing = 0.5;
                // When sneaking, legs stay straight - only arms swing slightly
                let targetSwing = (player.isWalking && !player.isSneaking) ? Math.sin(player.walkTime) * maxSwing : 0;
                let targetArmSwing = player.isWalking ? Math.sin(player.walkTime) * (player.isSneaking ? 0.15 : maxSwing) : 0;
                
                // Initialize swing value if not exists
                if (player.currentSwing === undefined) player.currentSwing = 0;
                if (player.currentArmSwing === undefined) player.currentArmSwing = 0;
                
                // Smoothly interpolate to target swing (returns to 0 when not walking)
                player.currentSwing = lerp(player.currentSwing, targetSwing, 0.1);
                player.currentArmSwing = lerp(player.currentArmSwing, targetArmSwing, 0.1);
                
                // Apply limb rotations - arms swing, legs stay straight when sneaking
                if (player.rightArmPivot) {
                    player.rightArmPivot.rotation.x = player.currentArmSwing;
                }
                if (player.leftArmPivot) {
                    player.leftArmPivot.rotation.x = -player.currentArmSwing;
                }
                
                // Sneaking animation - tilt body forward and lower height
                const targetBodyTilt = player.isSneaking ? 0.5 : 0; // Lean forward when sneaking
                const targetYOffset = player.isSneaking ? -0.25 : 0; // Lower when sneaking
                
                // Get current body tilt or initialize
                if (player.bodyTilt === undefined) player.bodyTilt = 0;
                if (player.sneakYOffset === undefined) player.sneakYOffset = 0;
                
                player.bodyTilt = lerp(player.bodyTilt, targetBodyTilt, 0.15);
                player.sneakYOffset = lerp(player.sneakYOffset, targetYOffset, 0.15);
                
                // Legs: counter-rotate to stay vertical when body tilts, plus walking animation
                if (player.rightLegPivot) {
                    player.rightLegPivot.rotation.x = -player.currentSwing - player.bodyTilt;
                }
                if (player.leftLegPivot) {
                    player.leftLegPivot.rotation.x = player.currentSwing - player.bodyTilt;
                }
                
                // Store previous position for speed calculation
                player.prevX = player.currentX;
                player.prevZ = player.currentZ;
                
                // Apply interpolated position (offset by -0.5 to align with blocks)
                player.group.position.set(
                    player.currentX - 0.5, 
                    player.currentY - 0.5 + player.sneakYOffset, 
                    player.currentZ - 0.5
                );
                
                // Apply rotation using Euler with YXZ order for proper sneaking pose
                // First yaw (Y), then pitch forward for sneaking (X)
                player.bodyGroup.rotation.order = 'YXZ';
                player.bodyGroup.rotation.y = player.currentYaw;
                player.bodyGroup.rotation.x = player.bodyTilt;
                
                if (player.headGroup) {
                    // Head compensates for body tilt and adds player look pitch
                    player.headGroup.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.currentPitch - player.bodyTilt));
                }
                
                // Name tag always faces camera
                player.nameTag.lookAt(camera.position);
            });
        }

        // Connect to server
        const eventSource = new EventSource('/telemetry-stream');
        
        eventSource.onopen = () => {
            console.log('Connected');
            document.getElementById('dot').className = 'dot connected';
            document.getElementById('status-text').textContent = 'Connected';
        };
        
        eventSource.onerror = () => {
            console.error('Disconnected');
            document.getElementById('dot').className = 'dot disconnected';
            document.getElementById('status-text').textContent = 'Disconnected';
        };
        
        eventSource.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            
            if (msg.type === 'init') {
                Object.values(msg.players).forEach(updatePlayer);
            } else if (msg.type === 'update') {
                updatePlayer(msg.player);
            } else if (msg.type === 'world_change') {
                // Player changed worlds - switch displayed world
                console.log(`World change: ${msg.data.world}`);
                switchToWorld(msg.data.world);
            } else if (msg.type === 'block_change') {
                // Real-time block update
                handleBlockChange(msg.data);
            } else if (msg.type === 'chunk') {
                // Single chunk (incremental loading)
                const { chunkX, chunkZ, blocks, world } = msg.data;
                const worldName = world || 'world';
                console.log(`Received chunk (${chunkX},${chunkZ}) in ${worldName}: ${blocks.length} blocks`);
                addChunk(chunkX, chunkZ, blocks, worldName);
            } else if (msg.type === 'chunk_unload') {
                // Unload distant chunks
                const { chunks, world } = msg.data;
                const worldName = world || 'world';
                console.log(`Unloading ${chunks.length} chunks from ${worldName}`);
                removeChunks(chunks, worldName);
            } else if (msg.type === 'chunks') {
                // Legacy bulk chunks
                console.log(`Received ${msg.data.blocks.length} blocks (bulk)`);
                renderBlocks(msg.data.blocks);
                
                // Position camera to view the blocks
                if (msg.data.blocks.length > 0 && !initialCameraPositioned) {
                    positionCameraToViewChunks();
                    initialCameraPositioned = true;
                }
            }
        };

        // FPS counter
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Update FPS
            frameCount++;
            const currentTime = performance.now();
            if (currentTime >= lastTime + 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastTime = currentTime;
            }
            
            animatePlayers(); // Smooth player interpolation and animation
            updateCamera();
            updateFrustumCulling(); // Frustum cull chunks
            renderer.render(scene, camera);
        }
        
        animate();
        console.log('McGPS Viewer initialized');
    </script>
