<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McGPS - Prismarine Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #header {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            pointer-events: auto;
        }

        #header h1 {
            font-size: 24px;
            color: #00ff88;
            margin-bottom: 5px;
        }

        #status {
            font-size: 14px;
            color: #88ffaa;
        }

        #player-list {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            min-width: 250px;
            max-height: 400px;
            overflow-y: auto;
            pointer-events: auto;
        }

        #player-list h2 {
            font-size: 18px;
            color: #00ff88;
            margin-bottom: 10px;
        }

        .player-item {
            padding: 8px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 14px;
        }

        .player-name {
            font-weight: bold;
            color: #00ffff;
        }

        .player-coords {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: 3px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            pointer-events: auto;
        }

        #controls h3 {
            font-size: 16px;
            color: #00ff88;
            margin-bottom: 10px;
        }

        #controls p {
            font-size: 13px;
            color: #cccccc;
            margin: 3px 0;
        }

        .connection-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .connected {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .disconnected {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }

        #player-list::-webkit-scrollbar {
            width: 8px;
        }

        #player-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        #player-list::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 10px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            text-align: center;
            font-size: 18px;
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">Loading Minecraft world viewer...</div>
        
        <div id="ui-overlay">
            <div id="header">
                <h1>McGPS Viewer (Prismarine)</h1>
                <div id="status">
                    <span class="connection-status disconnected" id="status-indicator"></span>
                    <span id="status-text">Connecting...</span>
                </div>
            </div>

            <div id="player-list">
                <h2>Online Players (<span id="player-count">0</span>)</h2>
                <div id="players"></div>
            </div>

            <div id="controls">
                <h3>Controls</h3>
                <p><strong>Right Click + Drag:</strong> Look around</p>
                <p><strong>WASD:</strong> Move camera</p>
                <p><strong>Space/Shift:</strong> Move up/down</p>
                <p><strong>Scroll:</strong> Zoom</p>
            </div>
        </div>
    </div>

    <script src="/prismarine-viewer/viewer.js"></script>
    <script type="module">
        const Vec3 = require('vec3').Vec3;
        const { WorldView, Viewer } = require('prismarine-viewer/viewer');
        
        // Initialize the viewer
        const viewerDiv = document.getElementById('container');
        const version = '1.20.4';
        
        console.log('Initializing Prismarine Viewer for Minecraft', version);
        
        // Create viewer instance
        const viewer = new Viewer({
            version: version,
            firstPerson: false,
            renderDistance: 6,
            showInventory: false
        });
        
        viewerDiv.appendChild(viewer.renderer.domElement);
        viewer.renderer.domElement.style.position = 'absolute';
        viewer.renderer.domElement.style.top = '0';
        viewer.renderer.domElement.style.left = '0';
        viewer.renderer.domElement.style.width = '100%';
        viewer.renderer.domElement.style.height = '100%';
        
        // Hide loading screen
        document.getElementById('loading').style.display = 'none';
        
        // Track players
        const players = new Map();
        const playerMarkers = new Map();
        
        // Connect to telemetry stream
        const eventSource = new EventSource('/telemetry-stream');
        
        eventSource.onopen = () => {
            console.log('Connected to telemetry stream');
            document.getElementById('status-indicator').className = 'connection-status connected';
            document.getElementById('status-text').textContent = 'Connected';
        };
        
        eventSource.onerror = () => {
            console.error('Lost connection to telemetry stream');
            document.getElementById('status-indicator').className = 'connection-status disconnected';
            document.getElementById('status-text').textContent = 'Disconnected';
        };
        
        eventSource.onmessage = (event) => {
            try {
                const message = JSON.parse(event.data);
                
                if (message.type === 'init') {
                    console.log('Received initial player data:', message.players);
                    Object.values(message.players).forEach(player => {
                        updatePlayer(player);
                    });
                } else if (message.type === 'update') {
                    updatePlayer(message.player);
                } else if (message.type === 'chunks') {
                    console.log('Received chunk data:', message.data.blocks.length, 'blocks');
                    loadChunkData(message.data);
                }
            } catch (error) {
                console.error('Error parsing telemetry:', error);
            }
        };
        
        /**
         * Load chunk data into prismarine-viewer
         */
        async function loadChunkData(data) {
            try {
                // Prismarine viewer expects chunks in a specific format
                // We need to convert our block list to chunk format
                console.log('Loading', data.blocks.length, 'blocks into viewer');
                
                // For now, just position the camera at the player location
                if (data.center) {
                    const pos = new Vec3(data.center.x, 80, data.center.z);
                    viewer.camera.position.set(pos.x, pos.y + 30, pos.z + 30);
                    viewer.camera.lookAt(pos.x, pos.y, pos.z);
                }
            } catch (error) {
                console.error('Error loading chunk data:', error);
            }
        }
        
        /**
         * Update player position and marker
         */
        function updatePlayer(data) {
            const { uuid, name, x, y, z, yaw, pitch } = data;
            
            players.set(uuid, data);
            
            // Create or update player marker in 3D world
            const pos = new Vec3(x, y, z);
            
            if (!playerMarkers.has(uuid)) {
                // TODO: Add player entity to viewer
                playerMarkers.set(uuid, { position: pos });
            } else {
                playerMarkers.get(uuid).position = pos;
            }
            
            // Update camera to follow first player
            if (players.size === 1) {
                viewer.camera.position.set(x, y + 30, z + 30);
                viewer.camera.lookAt(x, y, z);
            }
            
            updatePlayerList();
        }
        
        /**
         * Update the player list UI
         */
        function updatePlayerList() {
            const playerListDiv = document.getElementById('players');
            const playerCountSpan = document.getElementById('player-count');
            
            playerCountSpan.textContent = players.size;
            
            playerListDiv.innerHTML = '';
            
            players.forEach((data, uuid) => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player-item';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'player-name';
                nameDiv.textContent = data.name || uuid.substring(0, 8);
                
                const coordsDiv = document.createElement('div');
                coordsDiv.className = 'player-coords';
                coordsDiv.textContent = `X: ${Math.floor(data.x)} Y: ${Math.floor(data.y)} Z: ${Math.floor(data.z)}`;
                
                playerDiv.appendChild(nameDiv);
                playerDiv.appendChild(coordsDiv);
                playerListDiv.appendChild(playerDiv);
            });
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            viewer.camera.aspect = window.innerWidth / window.innerHeight;
            viewer.camera.updateProjectionMatrix();
            viewer.renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('McGPS Prismarine Viewer initialized');
    </script>
</body>
</html>
